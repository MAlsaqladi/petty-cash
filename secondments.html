<script>
/* =========================================================================
   نظام إدارة الانتدابات وتذاكر السفر — نفس بنية نظام العهد تمامًا
   (App / Views / Modals / Actions / Perm) لكن على جداول: trips, delegations,
   other_expenses بدل جداول العهد. الجداول المشتركة (federations, users,
   cost_centers) هي نفسها المستخدمة في نظام العهد.
   ========================================================================= */

const SCHEMA = {
  federations: ['federation_id','federation_name_ar','federation_name_en','image','created_by','created_at'],
  users: ['user_id','federation_id','user_status','employee_name_ar','employee_name_en','national_id','nationality','phone','email','user_name','password','user_type','Job_Title','language','created_at','created_by'],

  trips: ['trip_id','federation_number','trip_status','trip_name_ar','trip_name_en','trip_type','justifications','desired_results','achieved_results','cost_centers_id','start_date','end_date','trip_days_count','entity','other_notes','has_sports_equipment','is_transportation_available','is_accommodation_available','file','Balance_trips','created_by','created_at','request_approved_by','request_approval_date','closure_approved_by','closure_approval_date'],
  delegations: ['delegation_id','trip_id','federation_number','delegations_status','user_type','user_id','amount_delegations','is_linked_to_trip','justification','delegation_days_count','start_date','end_date','is_transportation_available','is_accommodation_available','achieved_goal','hours_count','ticket_type','is_car_traveler','ticket_price','total_amount','file','created_by','created_at','request_approved_by','request_approval_date'],
  other_expenses: ['expense_id','trip_id','federation_number','expense_status','expense_type','beneficiary','justification','amount','file','created_by','created_at','request_approved_by','request_approval_date']
};
const PK = {federations:'federation_id',users:'user_id',cost_centers:'cost_center_id',trips:'trip_id',delegations:'delegation_id',other_expenses:'expense_id'};

const USER_TYPES = ['مراجع','رئيس الاتحاد','مدير تنفيذي','محاسب','موظف','موارد بشرية','لاعب','حكم','متعاون'];
const NO_LOGIN_USER_TYPES = ['لاعب','حكم','متعاون'];
const TRIP_STATUSES = ['طلب','اعتماد التكليف','الصرف','الإقفال','مرفوضة'];
const TRIP_TYPES = ['مشاركة','بطولة','معسكر','وفود','اجتماعات'];
const ENTITIES = ['المملكة','أفريقيا والشرق الأوسط','آسيا','أوروبا'];
const TICKET_TYPES = ['اقتصادية','رجال أعمال','أخرى'];
const DELEGATION_STATUSES = ['غير معتمد','معتمد','مرفوض'];
const EXPENSE_STATUSES = ['غير معتمد','معتمد','ملغى'];

let DB = null;
let Session = { user:null, view:'dashboard', params:{} };

/* ---------------------------- Utilities ---------------------------- */
function uid(prefix){ return prefix + Math.random().toString(16).slice(2,10); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(d){
  if(!d) return '—';
  try{ const dt=(d instanceof Date)?d:new Date(d); if(isNaN(dt.getTime())) return String(d); return dt.toLocaleDateString('ar-SA',{year:'numeric',month:'short',day:'numeric'}); }
  catch(e){ return String(d); }
}
function fmtDateTime(d){
  if(!d) return '—';
  try{ const dt=(d instanceof Date)?d:new Date(d); if(isNaN(dt.getTime())) return String(d); return dt.toLocaleString('ar-SA',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return String(d); }
}
function money(n){ n=Number(n||0); return n.toLocaleString('ar-SA',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ر.س'; }
function esc(s){ if(s===null||s===undefined) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, kind){
  const root = document.getElementById('toastRoot');
  const box = document.createElement('div');
  box.className = 'toast';
  if(kind==='danger') box.style.background = 'var(--danger)';
  if(kind==='success') box.style.background = 'var(--success)';
  box.textContent = msg;
  root.appendChild(box);
  setTimeout(()=>{ box.style.transition='opacity .3s'; box.style.opacity='0'; setTimeout(()=>box.remove(),300); }, 2600);
}

/* ---------------------------- Server layer ---------------------------- */
async function apiCall(body){
  let res;
  try{ res = await fetch('/api/db', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) }); }
  catch(e){ return { data:null, error:{ message:'تعذّر الاتصال بالخادم.' } }; }
  try{ return await res.json(); }
  catch(e){ return { data:null, error:{ message:'استجابة غير متوقعة من الخادم' } }; }
}
const READ_SOURCE = { users: 'users_public' };
function readSource(table){ return READ_SOURCE[table] || table; }
async function loadAllData(){
  const tables = Object.keys(SCHEMA);
  const results = await Promise.all(tables.map(t => apiCall({ op:'select', table: readSource(t) })));
  const out = {};
  for(let i=0;i<tables.length;i++){
    if(results[i].error){ throw new Error(`تعذّرت قراءة جدول ${tables[i]}: ${results[i].error.message}`); }
    out[tables[i]] = results[i].data || [];
  }
  return out;
}
async function dbInsert(table, obj){
  const { data, error } = await apiCall({ op:'insert', table, payload: obj, returning: true });
  if(error){ toast('تعذّر الحفظ: ' + error.message, 'danger'); return null; }
  DB[table].push(data);
  return data;
}
async function dbUpdate(table, pkField, id, patch){
  const { data, error } = await apiCall({ op:'update', table, pkField, id, patch, returning: true });
  if(error){ toast('تعذّر التحديث: ' + error.message, 'danger'); return null; }
  const idx = DB[table].findIndex(r => r[pkField] === id);
  if(idx >= 0) DB[table][idx] = data;
  return data;
}
async function dbInsertUser(obj){
  const { error } = await apiCall({ op:'insert', table:'users', payload: obj, returning:false });
  if(error){ toast('تعذّر حفظ المستخدم: ' + error.message, 'danger'); return null; }
  DB.users.push(obj); return obj;
}
async function dbUpdateUser(userId, patch){
  const { error } = await apiCall({ op:'update', table:'users', pkField:'user_id', id:userId, patch, returning:false });
  if(error){ toast('تعذّر تحديث المستخدم: ' + error.message, 'danger'); return null; }
  const idx = DB.users.findIndex(r=>r.user_id===userId);
  if(idx>=0) Object.assign(DB.users[idx], patch);
  return idx>=0 ? DB.users[idx] : patch;
}
async function apiUpload(file, folder){
  const fd = new FormData(); fd.append('file', file); fd.append('folder', folder);
  let res;
  try{ res = await fetch('/api/upload', { method:'POST', body: fd }); }
  catch(e){ return { data:null, error:{ message:'تعذّر رفع الملف' } }; }
  try{ return await res.json(); } catch(e){ return { data:null, error:{ message:'استجابة غير متوقعة أثناء الرفع' } }; }
}
async function viewAttachment(filePath){
  if(!filePath){ toast('لا يوجد مرفق','danger'); return; }
  let res;
  try{ res = await fetch('/api/file-url', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ path:filePath }) }); }
  catch(e){ toast('تعذّر الاتصال بالخادم','danger'); return; }
  let json; try{ json = await res.json(); } catch(e){ toast('استجابة غير متوقعة','danger'); return; }
  if(json.error){ toast('تعذّر فتح المرفق: '+json.error.message,'danger'); return; }
  window.open(json.data.url, '_blank');
}
function attachBtnHTML(filePath){
  if(!filePath) return '';
  return `<button class="btn btn-ghost btn-sm" onclick="viewAttachment('${esc(filePath)}')" title="عرض المرفق">📎 المرفق</button>`;
}

/* ---------------------------- Permissions ---------------------------- */
const Perm = {
  isAuditor: u => u && u.user_type === 'مراجع',
  isPresident: u => u && u.user_type === 'رئيس الاتحاد',
  isExec: u => u && u.user_type === 'مدير تنفيذي',
  isAccountant: u => u && u.user_type === 'محاسب',
  isEmployee: u => u && u.user_type === 'موظف',
  isHR: u => u && u.user_type === 'موارد بشرية',
  isBasicStaff: u => Perm.isEmployee(u) || Perm.isHR(u),
  isTopApprover: u => Perm.isPresident(u) || Perm.isExec(u),
  canManageUsers: u => !Perm.isBasicStaff(u),
  canChangeUserStatus: u => Perm.isTopApprover(u),
  canEditUser: (u,target) => target && target.user_status==='تحت المعالجة' && (Perm.isTopApprover(u)||Perm.isAccountant(u)) && target.federation_id===u.federation_id,
  canManageCostCenters: u => Perm.isAccountant(u) || Perm.isTopApprover(u),
  /* موارد بشرية هي صاحبة صلاحية طلب الانتداب/الرحلة، وإن لم يوجد موارد بشرية بالاتحاد تنتقل للمحاسب */
  hrActiveExists: fedId => DB.users.some(x=>x.federation_id===fedId && x.user_type==='موارد بشرية' && x.user_status==='مفتوح'),
  canRequestTrip: u => {
    if(!u) return false;
    if(Perm.isHR(u)) return true;
    if(Perm.isAccountant(u) && !Perm.hrActiveExists(u.federation_id)) return true;
    return false;
  },
  canApproveTrip: u => Perm.isTopApprover(u),
  canStartDisbursement: u => Perm.isTopApprover(u) || Perm.isAccountant(u),
  canCloseTrip: u => Perm.isTopApprover(u),
  canEditTrip: (u,t) => t && t.trip_status==='طلب' && u.federation_id===t.federation_number && (u.user_id===t.created_by || Perm.isTopApprover(u) || Perm.isAccountant(u)),
  canManageParticipants: (u,t) => t && t.trip_status!=='الإقفال' && t.trip_status!=='مرفوضة' && !Perm.isAuditor(u) && u.federation_id===t.federation_number,
  canApproveParticipant: u => Perm.isTopApprover(u),
  canManageOtherExpenses: (u,t) => t && t.trip_status!=='الإقفال' && t.trip_status!=='مرفوضة' && !Perm.isAuditor(u) && u.federation_id===t.federation_number,
  canApproveOtherExpense: u => Perm.isTopApprover(u),
};

/* ---------------------------- Scoped data ---------------------------- */
function visibleTrips(u){
  if(!u) return [];
  if(Perm.isAuditor(u)) return DB.trips.slice();
  if(Perm.isBasicStaff(u)) return DB.trips.filter(t=>t.federation_number===u.federation_id && t.created_by===u.user_id);
  return DB.trips.filter(t=>t.federation_number===u.federation_id);
}
function visibleUsers(u){
  if(!u) return [];
  if(Perm.isAuditor(u)) return DB.users.slice();
  return DB.users.filter(x=>x.federation_id===u.federation_id);
}
function visibleCostCenters(u){
  if(!u) return [];
  if(Perm.isAuditor(u)) return DB.cost_centers.slice();
  return DB.cost_centers.filter(x=>x.federation_id===u.federation_id);
}
function federationById(id){ return DB.federations.find(f=>f.federation_id===id); }
function userById(id){ return DB.users.find(x=>x.user_id===id); }
function userLabel(id){ const x=userById(id); return x ? (x.employee_name_ar||x.user_name) : '—'; }
function costCenterLabel(id){ const c = DB.cost_centers.find(x=>x.cost_center_id===id); return c ? c.cost_center_name_ar : '—'; }
function tripCostCenterIds(t){ return (t.cost_centers_id||'').split(',').map(s=>s.trim()).filter(Boolean); }
function tripParticipants(tripId){ return DB.delegations.filter(d=>d.trip_id===tripId); }
function tripOtherExpenses(tripId){ return DB.other_expenses.filter(e=>e.trip_id===tripId); }
function tripFinancials(t){
  const participants = tripParticipants(t.trip_id);
  const otherExp = tripOtherExpenses(t.trip_id);
  const approvedParticipantsAmt = participants.filter(d=>d.delegations_status==='معتمد').reduce((s,d)=>s+Number(d.total_amount||0),0);
  const pendingParticipantsAmt = participants.filter(d=>d.delegations_status==='غير معتمد').reduce((s,d)=>s+Number(d.total_amount||0),0);
  const approvedOtherAmt = otherExp.filter(e=>e.expense_status==='معتمد').reduce((s,e)=>s+Number(e.amount||0),0);
  const pendingOtherAmt = otherExp.filter(e=>e.expense_status==='غير معتمد').reduce((s,e)=>s+Number(e.amount||0),0);
  const totalApproved = approvedParticipantsAmt + approvedOtherAmt;
  const totalPending = pendingParticipantsAmt + pendingOtherAmt;
  return { participants, otherExp, approvedParticipantsAmt, pendingParticipantsAmt, approvedOtherAmt, pendingOtherAmt, totalApproved, totalPending };
}
function tripStatusBadge(s){
  const map = {'طلب':'warning','اعتماد التكليف':'gold','الصرف':'info','الإقفال':'success','مرفوضة':'danger'};
  return `<span class="badge badge-${map[s]||'muted'}">${esc(s||'—')}</span>`;
}
function delegationStatusBadge(s){
  const map = {'غير معتمد':'warning','معتمد':'success','مرفوض':'danger'};
  return `<span class="badge badge-${map[s]||'muted'}">${esc(s||'—')}</span>`;
}
function expenseStatusBadge(s){
  const map = {'غير معتمد':'warning','معتمد':'success','ملغى':'danger'};
  return `<span class="badge badge-${map[s]||'muted'}">${esc(s||'—')}</span>`;
}
function userStatusBadge(s){
  const map = {'مفتوح':'success','مغلق':'muted','تحت المعالجة':'warning','مسودة':'muted'};
  return `<span class="badge badge-${map[s]||'muted'}">${esc(s||'—')}</span>`;
}

/* ---------------------------- Excel backup ---------------------------- */
function visibleDataForExport(){
  const u = Session.user;
  if(!u || Perm.isAuditor(u)) return DB;
  const trips = visibleTrips(u);
  const tripIds = new Set(trips.map(t=>t.trip_id));
  return {
    federations: DB.federations.filter(f=>f.federation_id===u.federation_id),
    users: visibleUsers(u),
    cost_centers: visibleCostCenters(u),
    trips,
    delegations: DB.delegations.filter(d=>tripIds.has(d.trip_id)),
    other_expenses: DB.other_expenses.filter(e=>tripIds.has(e.trip_id)),
  };
}
function exportWorkbook(){
  const scoped = visibleDataForExport();
  const wb = XLSX.utils.book_new();
  Object.keys(SCHEMA).forEach(sheetName=>{
    const headers = SCHEMA[sheetName];
    const rows = (scoped[sheetName]||[]).map(r=>{ const row={}; headers.forEach(h=>{ row[h]=(r[h]===undefined)?null:r[h]; }); return row; });
    const ws = XLSX.utils.json_to_sheet(rows, {header:headers});
    XLSX.utils.sheet_add_aoa(ws, [headers], {origin:'A1'});
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  XLSX.writeFile(wb, 'secondments-backup-' + stamp + '.xlsx');
}

/* ---------------------------- App bootstrap ---------------------------- */
async function bootApp(){
  const statusEl = document.getElementById('bootStatus');
  const sessionUser = Auth.readSession();
  if(!sessionUser){ Auth.goToLogin(); return; }
  if(NO_LOGIN_USER_TYPES.includes(sessionUser.user_type)){ Auth.clearSession(); Auth.goToLogin(); return; }
  try{
    statusEl.innerHTML = `<div class="alert alert-info">جارٍ الاتصال بالخادم…</div>`;
    DB = await loadAllData();
    if(DB.federations.length===0){
      statusEl.innerHTML = `<div class="alert alert-danger">لا يوجد أي اتحاد في قاعدة البيانات بعد.</div>`;
      return;
    }
    const freshUser = (DB.users||[]).find(x=>x.user_id===sessionUser.user_id);
    if(!freshUser || freshUser.user_status!=='مفتوح'){ Auth.clearSession(); Auth.goToLogin(); return; }
    Session.user = freshUser; Session.view = 'dashboard'; Session.params = {};
    document.getElementById('screen-boot').classList.add('hidden');
    document.getElementById('app-shell').classList.remove('hidden');
    App.renderShell();
    App.go('dashboard');
  }catch(err){
    console.error(err);
    statusEl.innerHTML = `<div class="alert alert-danger">تعذّر الاتصال بالخادم.<br><span class="small">${esc(err.message||'')}</span></div>`;
  }
}

/* ============================= App object ============================= */
const App = {};
App.logout = function(){ Session.user = null; Auth.clearSession(); Auth.goToLogin(); };
App.exportExcel = function(){ exportWorkbook(); toast('تم تنزيل نسخة محدّثة من ملف البيانات','success'); };
App.syncData = async function(){
  const btn = document.getElementById('syncBtn');
  if(btn){ btn.disabled=true; btn.textContent='🔄 جارٍ المزامنة…'; }
  try{ DB = await loadAllData(); App.render(); toast('تمت المزامنة بنجاح','success'); }
  catch(err){ toast('تعذّرت المزامنة: '+(err.message||''),'danger'); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='🔄 مزامنة'; } }
};

const NAV_ITEMS = [

App.renderShell = function(){
  const u = Session.user;
  const fed = federationById(u.federation_id);
  document.getElementById('sbFedName').innerHTML = fed ? (esc(fed.federation_name_ar)+'<small>الانتدابات وتذاكر السفر</small>') : ('كل الاتحادات<small>صلاحية المراجع</small>');
  document.getElementById('sbWho').innerHTML = esc(u.employee_name_ar||u.user_name) + '<small>'+esc(u.user_type)+'</small>';
  document.getElementById('sbAvatar').textContent = (u.employee_name_ar||u.user_name||'?').trim().charAt(0);
  const nav = document.getElementById('sbNav');
  nav.innerHTML = NAV_ITEMS.filter(n=>n.show(u)).map(n=>{
    const label = typeof n.label==='function' ? n.label(u) : n.label;
    return `<button class="sb-item" data-nav="${n.key}" onclick="App.go('${n.key}')"><span class="ico">${n.ico}</span><span>${esc(label)}</span></button>`;
  }).join('');
};
App.setActiveNav = function(key){
  document.querySelectorAll('.sb-item').forEach(el=>{
    el.classList.toggle('active', el.getAttribute('data-nav')===key);
  });
};
App.go = function(view, params){
  Session.view = view; Session.params = params || {};
  App.setActiveNav(view);
  const meta = VIEW_META[view] || {title:'',crumb:''};
  document.getElementById('topTitle').textContent = meta.title;
  document.getElementById('topCrumb').textContent = meta.crumb;
  window.scrollTo(0,0);
  App.render();
};
App.render = function(){
  const view = document.getElementById('view');
  const fn = Views[Session.view];
  view.innerHTML = fn ? fn(Session.params.id) : `<div class="card card-pad">الصفحة غير موجودة.</div>`;
};

/* ============================= Modal helpers ============================= */
function modalShell(id, title, bodyHTML, wide, footerHTML){
  return `<div class="modal-overlay" id="${id}Overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal ${wide?'modal-wide':''}">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
      <div class="modal-body" id="${id}Body">${bodyHTML}</div>
      ${footerHTML!==false ? `<div class="modal-foot">${footerHTML||''}</div>` : ''}
    </div>
  </div>`;
}
function openModalHTML(html){ document.getElementById('modalRoot').innerHTML = html; }
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

/* ============================= Trips list ============================= */
Views.trips = function(){
  const u = Session.user;
  let list = visibleTrips(u).slice().sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  const addBtn = Perm.canRequestTrip(u) ? `<button class="btn btn-primary" onclick="Modals.addTrip()">+ طلب رحلة جديدة</button>` : '';
  const isAud = Perm.isAuditor(u);
  function rowsFor(items){
    return items.length ? items.map(t=>`
      <tr class="clickable-row" onclick="App.go('tripDetail',{id:'${t.trip_id}'})">
        <td><b>${esc(t.trip_name_ar||'—')}</b><div class="muted small">${esc(t.trip_type||'—')} · ${esc(t.entity||'—')}</div></td>
        <td>${tripStatusBadge(t.trip_status)}</td>
        <td>${fmtDate(t.start_date)}</td>
        <td>${fmtDate(t.end_date)}</td>
        <td>${esc(userLabel(t.created_by))}</td>
        <td>${fmtDate(t.created_at)}</td>
      </tr>`).join('') : `<tr><td colspan="6"><div class="empty-row">لا توجد رحلات</div></td></tr>`;
  }
  function tableFor(items){
    return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>الرحلة</th><th>الحالة</th><th>تاريخ البداية</th><th>تاريخ النهاية</th><th>مقدّم الطلب</th><th>تاريخ الطلب</th></tr></thead>
    <tbody>${rowsFor(items)}</tbody></table></div>`;
  }
  return `
    <div class="section-head"><div><div class="eyebrow">الرحلات</div><h2>طلبات الرحلات والانتدابات</h2></div>${addBtn}</div>
    <div class="mt-16">
      ${isAud ? renderFederationTree(list, t=>t.federation_number, tableFor, items=>statChip('العدد', items.length)) : tableFor(list)}
    </div>
  `;
};

function renderFederationTree(items, fedKeyFn, tableFor, statsFn){
  const groups = {};
  items.forEach(it=>{ const k=fedKeyFn(it)||'—'; (groups[k]=groups[k]||[]).push(it); });
  return Object.keys(groups).map(fedId=>{
    const fed = federationById(fedId);
    const items2 = groups[fedId];
    return `<div class="card mt-16">
      <div class="card-pad" style="padding-bottom:0;">
        <div class="section-head" style="margin-bottom:8px;">
          <h3 style="font-size:14px;margin:0;">${esc(fed?fed.federation_name_ar:'بدون اتحاد')}</h3>
          <div class="flex gap-8">${statsFn(items2)}</div>
        </div>
      </div>
      ${tableFor(items2)}
    </div>`;
  }).join('') || `<div class="empty-row">لا توجد بيانات</div>`;
}
function statChip(lbl, val){ return `<span class="chip on" style="cursor:default;">${esc(lbl)}: <b>${esc(String(val))}</b></span>`; }

let TripDraft = null;
Modals.addTrip = function(){
  const u = Session.user;
  if(!Perm.canRequestTrip(u)){ toast('لا تملك صلاحية طلب رحلة/انتداب','danger'); return; }
  const fedCC = DB.cost_centers.filter(x=>x.federation_id===u.federation_id);
  TripDraft = {
    federation_number: u.federation_id, trip_name_ar:'', trip_name_en:'', trip_type:TRIP_TYPES[0],
    justifications:'', desired_results:'', cost_center_id: fedCC[0]?fedCC[0].cost_center_id:'', start_date:'', end_date:'', entity:ENTITIES[0],
    other_notes:'', has_sports_equipment:false, is_transportation_available:false, is_accommodation_available:false
  };
  openModalHTML(modalShell('addTripModal','طلب رحلة / انتداب جديد', Modals.renderAddTripBody(), true,
    `<button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
     <button class="btn btn-primary" id="saveTripBtn" onclick="Actions.saveTrip()" ${isTripDraftValid(TripDraft)?'':'disabled'}>حفظ طلب الرحلة</button>`));
};
function isTripDraftValid(d){
  if(!d.trip_name_ar.trim() || !d.start_date || !d.end_date) return false;
  if(!d.cost_center_id) return false;
  return true;
}
Modals.renderAddTripBody = function(){
  const u = Session.user;
  const fedCC = DB.cost_centers.filter(x=>x.federation_id===u.federation_id);
  const d = TripDraft;

  const entityOpts = ENTITIES.map(t=>`<option value="${esc(t)}" ${d.entity===t?'selected':''}>${esc(t)}</option>`).join('');
  const ccOpts = fedCC.length ? fedCC.map(cc=>`<option value="${cc.cost_center_id}" ${d.cost_center_id===cc.cost_center_id?'selected':''}>${esc(cc.cost_center_name_ar)}</option>`).join('') : '';
  return `
  <div class="form-grid">
    <div class="field full"><label>اسم الرحلة (عربي) <span class="muted">— إلزامي</span></label><input type="text" value="${esc(d.trip_name_ar)}" oninput="Modals.updateTripField('trip_name_ar',this.value)"></div>
    <div class="field full"><label>اسم الرحلة (إنجليزي)</label><input type="text" value="${esc(d.trip_name_en)}" oninput="Modals.updateTripField('trip_name_en',this.value)"></div>
    <div class="field"><label>نوع الرحلة</label><select onchange="Modals.updateTripField('trip_type',this.value)">${typeOpts}</select></div>
    <div class="field"><label>إلى أين (الجهة)</label><select onchange="Modals.updateTripField('entity',this.value)">${entityOpts}</select></div>
    <div class="field"><label>تاريخ البداية <span class="muted">— إلزامي</span></label><input type="date" value="${esc(d.start_date)}" oninput="Modals.updateTripField('start_date',this.value)"></div>
    <div class="field"><label>تاريخ النهاية <span class="muted">— إلزامي</span></label><input type="date" value="${esc(d.end_date)}" oninput="Modals.updateTripField('end_date',this.value)"></div>
    <div class="field full"><label>المبررات</label><textarea rows="2" oninput="Modals.updateTripField('justifications',this.value)">${esc(d.justifications)}</textarea></div>
    <div class="field full"><label>الأهداف المطلوب تحقيقها</label><textarea rows="2" oninput="Modals.updateTripField('desired_results',this.value)">${esc(d.desired_results)}</textarea></div>
    <div class="field full"><label>ملاحظات أخرى</label><textarea rows="2" oninput="Modals.updateTripField('other_notes',this.value)">${esc(d.other_notes)}</textarea></div>
    <div class="field full">
      <label>مركز التكلفة <span class="muted">— إلزامي، اختر واحدًا فقط</span></label>
      ${fedCC.length ? `<select onchange="Modals.updateTripField('cost_center_id',this.value)">${ccOpts}</select>` : `<div class="muted small">لا توجد مراكز تكلفة لهذا الاتحاد بعد.</div>`}
    </div>
    <div class="field"><label>هل يشمل الانتداب نقلاً؟</label><select onchange="Modals.updateTripField('is_transportation_available',this.value==='true')">
      <option value="false" ${!d.is_transportation_available?'selected':''}>لا</option><option value="true" ${d.is_transportation_available?'selected':''}>نعم</option></select></div>
    <div class="field"><label>هل يشمل الانتداب سكنًا؟</label><select onchange="Modals.updateTripField('is_accommodation_available',this.value==='true')">
      <option value="false" ${!d.is_accommodation_available?'selected':''}>لا</option><option value="true" ${d.is_accommodation_available?'selected':''}>نعم</option></select></div>
    <div class="field"><label>معدّات رياضية مصاحبة؟</label><select onchange="Modals.updateTripField('has_sports_equipment',this.value==='true')">
      <option value="false" ${!d.has_sports_equipment?'selected':''}>لا</option><option value="true" ${d.has_sports_equipment?'selected':''}>نعم</option></select></div>
  </div>`;
};
Modals.updateTripField = function(key,val){
  TripDraft[key]=val;
  const saveBtn=document.getElementById('saveTripBtn');
  if(saveBtn) saveBtn.disabled = !isTripDraftValid(TripDraft);
};
Actions.saveTrip = async function(){
  const u = Session.user;
  const d = TripDraft;
  if(!isTripDraftValid(d)){ toast('أكمل الحقول الإلزامية أولاً','danger'); return; }
  const days = Math.max(1, Math.round((new Date(d.end_date)-new Date(d.start_date))/86400000)+1);
  const tripId = uid('trp');
  const trip = {
    trip_id: tripId, federation_number: d.federation_number, trip_status:'طلب',
    trip_name_ar: d.trip_name_ar, trip_name_en: d.trip_name_en, trip_type: d.trip_type,
    justifications: d.justifications, desired_results: d.desired_results, achieved_results:null,
    cost_centers_id: d.cost_center_id, start_date: d.start_date, end_date: d.end_date,
    trip_days_count: days, entity: d.entity, other_notes: d.other_notes,
    has_sports_equipment: !!d.has_sports_equipment, is_transportation_available: !!d.is_transportation_available,
    is_accommodation_available: !!d.is_accommodation_available, file:null, Balance_trips:0,
    created_by: u.user_id, created_at: nowISO(),
    request_approved_by:null, request_approval_date:null, closure_approved_by:null, closure_approval_date:null
  };
  const saved = await dbInsert('trips', trip);
  if(!saved) return;
  closeModal();
  toast('تم إرسال طلب الرحلة بنجاح، بانتظار اعتماد التكليف','success');
  App.go('tripDetail',{id:tripId});
};

Actions.updateTrip = async function(tripId){
  const t = DB.trips.find(x=>x.trip_id===tripId);
  const u = Session.user;
  if(!Perm.canEditTrip(u,t)){ toast('لا يمكن تعديل هذه الرحلة','danger'); return; }
  const ccIds = Array.from(document.querySelectorAll('#etCcSelect .chip.on')).map(el=>el.dataset.cc);
  const start = document.getElementById('etStart').value;
  const end = document.getElementById('etEnd').value;
  const days = (start&&end) ? Math.max(1, Math.round((new Date(end)-new Date(start))/86400000)+1) : t.trip_days_count;
  const patch = {
    trip_name_ar: document.getElementById('etNameAr').value,
    trip_name_en: document.getElementById('etNameEn').value,
    trip_type: document.getElementById('etType').value,
    entity: document.getElementById('etEntity').value,
    start_date: start||null, end_date: end||null, trip_days_count: days,
    cost_centers_id: ccIds.join(',')
  };
  const saved = await dbUpdate('trips','trip_id',tripId,patch);
  if(!saved) return;
  closeModal(); toast('تم حفظ التعديل','success'); App.go('tripDetail',{id:tripId});
};

let ParticipantDraft = null;
Modals.addParticipant = function(tripId){
  const t = DB.trips.find(x=>x.trip_id===tripId);
  const u = Session.user;
  const fedUsers = DB.users.filter(x=>x.federation_id===t.federation_number && x.user_status==='مفتوح');
  ParticipantDraft = {
    trip_id: tripId, user_type_filter:'', user_id: fedUsers[0]?fedUsers[0].user_id:'',
    is_linked_to_trip: true, start_date: t.start_date, end_date: t.end_date,
    is_transportation_available: !!t.is_transportation_available, is_accommodation_available: !!t.is_accommodation_available,
    ticket_type: TICKET_TYPES[0], is_car_traveler:false, ticket_price:0, amount_delegations:0, hours_count:'', justification:''
  };
  openModalHTML(modalShell('addParticipantModal','إضافة مشارك للانتداب', Modals.renderAddParticipantBody(), true,
    `<button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
     <button class="btn btn-primary" onclick="Actions.saveParticipant()">حفظ</button>`));
};
function participantDaysCount(){
  const d = ParticipantDraft;
  if(!d.start_date || !d.end_date) return null;
  return Math.max(1, Math.round((new Date(d.end_date)-new Date(d.start_date))/86400000)+1);
}
Modals.renderAddParticipantBody = function(){
  const d = ParticipantDraft;
  const t = DB.trips.find(x=>x.trip_id===d.trip_id);
  const fedUsers = DB.users.filter(x=>x.federation_id===t.federation_number && x.user_status==='مفتوح');
  const typesPresent = Array.from(new Set(fedUsers.map(x=>x.user_type))).sort();
  const typeFilterOpts = `<option value="">— كل الأنواع —</option>` + typesPresent.map(ty=>`<option value="${esc(ty)}" ${d.user_type_filter===ty?'selected':''}>${esc(ty)}</option>`).join('');
  const filteredUsers = d.user_type_filter ? fedUsers.filter(x=>x.user_type===d.user_type_filter) : fedUsers;
  const usersOpts = filteredUsers.map(x=>`<option value="${x.user_id}" ${d.user_id===x.user_id?'selected':''}>${esc(x.employee_name_ar)} — ${esc(x.Job_Title||x.user_type)}</option>`).join('') || `<option value="">لا يوجد مستخدمون بهذا النوع</option>`;
  const selectedUser = userById(d.user_id);
  const resolvedType = selectedUser ? selectedUser.user_type : '—';
  const ticketOpts = TICKET_TYPES.map(x=>`<option value="${esc(x)}" ${d.ticket_type===x?'selected':''}>${esc(x)}</option>`).join('');
  const days = d.is_linked_to_trip ? t.trip_days_count : participantDaysCount();
  const total = Number(d.ticket_price||0) + Number(d.amount_delegations||0);

  const matchBlock = d.is_linked_to_trip ? `
    <div class="field"><label>تاريخ البداية</label><input type="date" value="${esc(t.start_date?String(t.start_date).slice(0,10):'')}" disabled></div>
    <div class="field"><label>تاريخ النهاية</label><input type="date" value="${esc(t.end_date?String(t.end_date).slice(0,10):'')}" disabled></div>
    <div class="field"><label>عدد الأيام</label><input type="text" value="${esc(days||'—')}" disabled></div>
    <div class="field"><label>يشمل نقل؟</label><input type="text" value="${t.is_transportation_available?'نعم':'لا'}" disabled></div>
    <div class="field"><label>يشمل سكن؟</label><input type="text" value="${t.is_accommodation_available?'نعم':'لا'}" disabled></div>
  ` : `
    <div class="field"><label>تاريخ البداية</label><input type="date" value="${esc(d.start_date||'')}" oninput="Modals.updateParticipantField('start_date',this.value)"></div>
    <div class="field"><label>تاريخ النهاية</label><input type="date" value="${esc(d.end_date||'')}" oninput="Modals.updateParticipantField('end_date',this.value)"></div>
    <div class="field"><label>عدد الأيام (تلقائي)</label><input type="text" value="${esc(days||'—')}" disabled></div>
    <div class="field"><label>يشمل نقل؟</label><select onchange="Modals.updateParticipantField('is_transportation_available',this.value==='true')">
      <option value="false" ${!d.is_transportation_available?'selected':''}>لا</option><option value="true" ${d.is_transportation_available?'selected':''}>نعم</option></select></div>
    <div class="field"><label>يشمل سكن؟</label><select onchange="Modals.updateParticipantField('is_accommodation_available',this.value==='true')">
      <option value="false" ${!d.is_accommodation_available?'selected':''}>لا</option><option value="true" ${d.is_accommodation_available?'selected':''}>نعم</option></select></div>
  `;

  return `
    <div class="form-grid">
      <div class="field"><label>نوع المستخدم (تصفية)</label><select onchange="Modals.updateParticipantTypeFilter(this.value)">${typeFilterOpts}</select></div>
      <div class="field"><label>المشارك</label><select onchange="Modals.updateParticipantField('user_id',this.value)">${usersOpts}</select></div>
      <div class="field"><label>نوع الحساب (تلقائي)</label><input type="text" value="${esc(resolvedType)}" disabled></div>
      <div class="field"><label>مطابق لتفاصيل الرحلة؟</label><select onchange="Modals.updateParticipantField('is_linked_to_trip',this.value==='true')">
        <option value="true" ${d.is_linked_to_trip?'selected':''}>نعم</option><option value="false" ${!d.is_linked_to_trip?'selected':''}>لا</option></select></div>
      ${matchBlock}
      <div class="field"><label>نوع التذكرة</label><select onchange="Modals.updateParticipantField('ticket_type',this.value)">${ticketOpts}</select></div>
      <div class="field"><label>سفر بسيارة؟</label><select onchange="Modals.updateParticipantField('is_car_traveler',this.value==='true')">
        <option value="false" ${!d.is_car_traveler?'selected':''}>لا</option><option value="true" ${d.is_car_traveler?'selected':''}>نعم</option></select></div>
      <div class="field"><label>سعر التذكرة</label><input type="number" min="0" step="0.01" value="${d.ticket_price}" oninput="Modals.updateParticipantAmount('ticket_price',this.value)"></div>
      <div class="field"><label>بدل الانتداب</label><input type="number" min="0" step="0.01" value="${d.amount_delegations}" oninput="Modals.updateParticipantAmount('amount_delegations',this.value)"></div>
      <div class="field"><label>عدد الساعات (إن وجد)</label><input type="number" min="0" step="0.5" value="${esc(d.hours_count)}" oninput="Modals.updateParticipantField('hours_count',this.value)"></div>
      <div class="field full"><label>المبرر</label><textarea rows="2" oninput="Modals.updateParticipantField('justification',this.value)">${esc(d.justification)}</textarea></div>
      <div class="field full"><label>مرفق (تذكرة/إثبات)</label><input type="file" id="dgFile" accept="image/*,.pdf"></div>
    </div>
    <div class="mt-12 flex between" id="dgTotalRow" style="font-weight:800;"><span>الإجمالي</span><span class="num" id="dgTotalAmount">${money(total)}</span></div>
  `;
};
Modals.updateParticipantTypeFilter = function(val){
  ParticipantDraft.user_type_filter = val;
  const t = DB.trips.find(x=>x.trip_id===ParticipantDraft.trip_id);
  const fedUsers = DB.users.filter(x=>x.federation_id===t.federation_number && x.user_status==='مفتوح');
  const filtered = val ? fedUsers.filter(x=>x.user_type===val) : fedUsers;
  ParticipantDraft.user_id = filtered[0] ? filtered[0].user_id : '';
  const body = document.getElementById('addParticipantModalBody');
  if(body) body.innerHTML = Modals.renderAddParticipantBody();
};
Modals.updateParticipantField = function(key,val){
  ParticipantDraft[key] = val;
  if(key==='user_id'){
    // إعادة ضبط النوع التلقائي والتاريخ الافتراضي تُعاد بإعادة الرسم الكامل
  }
  const body = document.getElementById('addParticipantModalBody');
  if(body) body.innerHTML = Modals.renderAddParticipantBody();
};
Modals.updateParticipantAmount = function(key,val){
  ParticipantDraft[key] = val;
  const total = Number(ParticipantDraft.ticket_price||0) + Number(ParticipantDraft.amount_delegations||0);
  const el = document.getElementById('dgTotalAmount');
  if(el) el.textContent = money(total);
};
Actions.saveParticipant = async function(){
  const d = ParticipantDraft;
  const t = DB.trips.find(x=>x.trip_id===d.trip_id);
  const u = Session.user;
  if(!Perm.canManageParticipants(u,t)){ toast('لا تملك صلاحية إضافة مشارك','danger'); return; }
  if(!d.user_id){ toast('اختر مشاركًا','danger'); return; }
  const target = userById(d.user_id);
  const ticketPrice = Number(d.ticket_price||0);
  const amount = Number(d.amount_delegations||0);
  const startDate = d.is_linked_to_trip ? t.start_date : (d.start_date||null);
  const endDate = d.is_linked_to_trip ? t.end_date : (d.end_date||null);
  const days = d.is_linked_to_trip ? t.trip_days_count : participantDaysCount();
  const transport = d.is_linked_to_trip ? !!t.is_transportation_available : !!d.is_transportation_available;
  const accom = d.is_linked_to_trip ? !!t.is_accommodation_available : !!d.is_accommodation_available;
  let filePath = null;
  const fileInput = document.getElementById('dgFile');
  if(fileInput && fileInput.files[0]){
    const up = await apiUpload(fileInput.files[0], 'delegations');
    if(up.error){ toast('تعذّر رفع المرفق: '+up.error.message,'danger'); return; }
    filePath = up.data.path;
  }
  const saved = await dbInsert('delegations', {
    delegation_id: uid('dlg'), trip_id: d.trip_id, federation_number: t.federation_number,
    delegations_status:'غير معتمد', user_type: target?target.user_type:null, user_id:d.user_id,
    amount_delegations: amount, is_linked_to_trip: !!d.is_linked_to_trip, justification: d.justification,
    delegation_days_count: days, start_date:startDate, end_date:endDate,
    is_transportation_available: transport, is_accommodation_available: accom,
    achieved_goal:null, hours_count: d.hours_count?Number(d.hours_count):null,
    ticket_type: d.ticket_type, is_car_traveler: !!d.is_car_traveler,
    ticket_price: ticketPrice, total_amount: ticketPrice+amount, file: filePath,
    created_by: u.user_id, created_at: nowISO(), request_approved_by:null, request_approval_date:null
  });
  if(!saved) return;
  closeModal(); toast('تمت إضافة المشارك — بانتظار الاعتماد','success'); App.go('tripDetail',{id:d.trip_id});
};

Actions.saveOtherExpense = async function(tripId){
  const t = DB.trips.find(x=>x.trip_id===tripId);
  const u = Session.user;
  if(!Perm.canManageOtherExpenses(u,t)){ toast('لا تملك صلاحية إضافة مصروف','danger'); return; }
  const amt = Number(document.getElementById('oeAmount').value||0);
  if(!amt || amt<=0){ toast('أدخل مبلغًا صحيحًا','danger'); return; }
  let filePath = null;
  const fileInput = document.getElementById('oeFile');
  if(fileInput.files[0]){
    const up = await apiUpload(fileInput.files[0], 'other_expenses');
    if(up.error){ toast('تعذّر رفع المرفق: '+up.error.message,'danger'); return; }
    filePath = up.data.path;
  }
  const saved = await dbInsert('other_expenses', {
    expense_id: uid('oex'), trip_id: tripId, federation_number: t.federation_number, expense_status:'غير معتمد',
    expense_type: document.getElementById('oeType').value, beneficiary: document.getElementById('oeBeneficiary').value,
    justification: document.getElementById('oeJustification').value, amount: amt, file: filePath,
    created_by: u.user_id, created_at: nowISO(), request_approved_by:null, request_approval_date:null
  });
  if(!saved) return;
  closeModal(); toast('تمت إضافة المصروف — بانتظار الاعتماد','success'); App.go('tripDetail',{id:tripId});
};

        <div><div class="kv-lbl">نوع المستخدم</div><div class="kv-val">${esc(u.user_type)}</div></div>
        <div><div class="kv-lbl">اسم المستخدم</div><div class="kv-val">${esc(u.user_name)}</div></div>
        <div><div class="kv-lbl">الجوال</div><div class="kv-val">${esc(u.phone||'—')}</div></div>
      </div>
    </div>
    <div class="card card-pad mt-16">
      <h3 style="margin-top:0;">تغيير كلمة المرور</h3>
      <div class="form-grid">
        <div class="field"><label>كلمة المرور الحالية</label><input type="password" id="pfOld"></div>
        <div class="field"><label>كلمة المرور الجديدة</label><input type="password" id="pfNew"></div>
      </div>
      <button class="btn btn-primary mt-8" onclick="Actions.changePassword()">تحديث كلمة المرور</button>
    </div>
  `;
};
Actions.changePassword = async function(){
  const oldP = document.getElementById('pfOld').value;
  const newP = document.getElementById('pfNew').value;
  if(!oldP || !newP){ toast('أكمل الحقلين','danger'); return; }
  const { data, error } = await apiCall({ op:'rpc', fn:'change_password', args:{ p_user_id: Session.user.user_id, p_old_password: oldP, p_new_password: newP } });
  if(error){ toast('تعذّر تحديث كلمة المرور: '+error.message,'danger'); return; }
  if(data===false){ toast('كلمة المرور الحالية غير صحيحة','danger'); return; }
  toast('تم تحديث كلمة المرور بنجاح','success');
  document.getElementById('pfOld').value=''; document.getElementById('pfNew').value='';
};

document.addEventListener('DOMContentLoaded', function(){ bootApp(); });
</script>
</body>
</html>
