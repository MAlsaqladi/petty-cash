<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة العهد النقدية للاتحادات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#E8F0EA;
  --paper:#F2F7F3;
  --panel:#FFFFFF;
  --ink:#14261B;
  --ink-2:#1F3D2B;
  --muted:#5C6E62;
  --line:#D6E3DA;
  --line-soft:#E7F0EA;
  --teal:#3FA579;
  --teal-dark:#2A7A57;
  --teal-soft:#DFF1E7;
  --gold:#C79A4E;
  --gold-soft:#F5EAD3;
  --danger:#B23A2E;
  --danger-soft:#F7E3E0;
  --warning:#B8720F;
  --warning-soft:#FBEDD9;
  --success:#2E8562;
  --success-soft:#DEF0E6;
  --info:#8B5FA6;
  --info-soft:#EFE6F3;
  --radius:12px;
  --shadow:0 1px 2px rgba(20,38,27,.05), 0 8px 24px -12px rgba(20,38,27,.20);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Tajawal',sans-serif;
  font-size:14.5px;
  line-height:1.6;
  min-height:100vh;
}
h1,h2,h3,h4,.display{font-family:'Almarai',sans-serif;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
a{color:inherit;}
::selection{background:var(--gold-soft);}

/* ---------- Ledger paper background texture ---------- */
.paper-bg{
  background-image:
    linear-gradient(var(--line-soft) 1px, transparent 1px);
  background-size: 100% 42px;
  background-position: 0 96px;
}

/* ---------- Utility ---------- */
.hidden{display:none !important;}
.container{max-width:1180px;margin:0 auto;padding:0 22px;}
.muted{color:var(--muted);}
.flex{display:flex;}
.between{justify-content:space-between;}
.center{align-items:center;}
.gap-8{gap:8px;} .gap-12{gap:12px;} .gap-16{gap:16px;} .gap-24{gap:24px;}
.wrap{flex-wrap:wrap;}
.grow{flex:1;}
.mt-8{margin-top:8px;} .mt-12{margin-top:12px;} .mt-16{margin-top:16px;} .mt-24{margin-top:24px;} .mt-32{margin-top:32px;}
.mb-8{margin-bottom:8px;} .mb-12{margin-bottom:12px;} .mb-16{margin-bottom:16px;}
.text-left{text-align:left;} .text-center{text-align:center;}
.small{font-size:12.5px;}
.tabular{font-variant-numeric:tabular-nums;}
.num{font-family:'Tajawal',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid transparent;border-radius:9px;
  padding:9px 16px;font-weight:700;font-size:13.5px;cursor:pointer;
  transition:transform .05s ease, box-shadow .15s ease, background .15s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-dark);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-gold:hover{background:#a67f3f;}
.btn-outline{background:transparent;color:var(--ink-2);border-color:var(--line);}
.btn-outline:hover{border-color:var(--teal);color:var(--teal);}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger-soft);}
.btn-danger:hover{background:var(--danger-soft);}
.btn-ghost{background:transparent;color:var(--muted);border:none;padding:6px 8px;}
.btn-ghost:hover{color:var(--ink);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- Cards / Panels ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:20px 22px;}

/* ---------- Badges (status pills) ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:100px;font-size:12px;font-weight:700;line-height:1;white-space:nowrap;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-success{background:var(--success-soft);color:var(--success);}
.badge-warning{background:var(--warning-soft);color:var(--warning);}
.badge-danger{background:var(--danger-soft);color:var(--danger);}
.badge-info{background:var(--info-soft);color:var(--info);}
.badge-muted{background:#EAEDEC;color:var(--muted);}
.badge-gold{background:var(--gold-soft);color:var(--gold);}

/* =====================================================
   SCREEN: file picker / login (centered stage)
   ===================================================== */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.stage-card{width:100%;max-width:430px;}
.brandmark{
  width:56px;height:56px;border-radius:14px;
  background:linear-gradient(155deg, var(--teal) 0%, var(--teal-dark) 100%);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:'Almarai',sans-serif;font-weight:800;font-size:22px;
  box-shadow:0 8px 20px -8px rgba(11,110,92,.55);
  margin-bottom:18px;
}
.stage-title{font-size:22px;font-weight:800;margin:0 0 4px;}
.stage-sub{color:var(--muted);margin:0 0 26px;font-size:13.5px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;border:1.5px solid var(--line);border-radius:9px;
  padding:10px 12px;background:var(--paper);outline:none;
  transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);background:#fff;}
.field input[type="file"]{padding:8px;background:var(--paper);border:1.5px dashed var(--line);cursor:pointer;}
.field input[type="file"]::file-selector-button{background:var(--teal);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-weight:700;font-size:12px;margin-left:8px;cursor:pointer;}
.field input[type="file"]::file-selector-button:hover{background:var(--teal-dark);}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:5px;}
.upload-drop{
  border:2px dashed var(--line);border-radius:14px;padding:34px 20px;text-align:center;
  cursor:pointer;transition:border-color .15s, background .15s;background:var(--paper);
}
.upload-drop:hover{border-color:var(--teal);background:var(--teal-soft);}
.upload-drop .icon{font-size:30px;margin-bottom:8px;}
.alert{border-radius:9px;padding:10px 14px;font-size:13px;margin-top:14px;border:1px solid transparent;}
.alert-danger{background:var(--danger-soft);color:var(--danger);border-color:#f0cac5;}
.alert-info{background:var(--info-soft);color:var(--info);border-color:#ddc9e6;}
.alert-success{background:var(--success-soft);color:var(--success);border-color:#c7e8d5;}
.alert-warning{background:var(--warning-soft);color:var(--warning);border-color:#f0dcb0;}
.demo-box{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin-top:16px;font-size:12px;}
.demo-box .row{display:flex;justify-content:space-between;padding:3px 0;}
.demo-box b{font-family:'Tajawal',sans-serif;}

/* =====================================================
   APP SHELL
   ===================================================== */
#app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex-shrink:0;background:var(--ink);color:#c9d6cc;
  display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sb-brand{display:flex;align-items:center;gap:10px;padding:0 6px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:16px;}
.sb-brand .mark{width:34px;height:34px;border-radius:9px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Almarai';font-weight:800;color:#1c1404;flex-shrink:0;}
.sb-brand .fed{font-size:12.5px;font-weight:700;color:#fff;line-height:1.3;}
.sb-brand .fed small{display:block;color:#8fa899;font-weight:400;font-size:10.5px;}
.sb-nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.sb-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
  color:#aebfb0;text-decoration:none;font-size:13px;font-weight:700;cursor:pointer;border:none;background:transparent;width:100%;text-align:right;
}
.sb-item .ico{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;opacity:.9;}
.sb-item .ico svg{width:17px;height:17px;}
.sb-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.sb-item.active{background:var(--teal);color:#fff;}
.sb-foot{border-top:1px solid rgba(255,255,255,.08);padding-top:12px;margin-top:12px;}
.sb-user{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;}
.sb-user:hover{background:rgba(255,255,255,.06);}
.sb-user .av{width:32px;height:32px;border-radius:50%;background:var(--teal-soft);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
.sb-user .who{font-size:12.5px;color:#fff;font-weight:700;line-height:1.3;}
.sb-user .who small{display:block;color:#8fa899;font-weight:400;}
.sb-logout{display:block;width:100%;text-align:center;margin-top:10px;font-size:11.5px;color:#82977f;background:none;border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:7px;cursor:pointer;}
.sb-logout:hover{color:#fff;border-color:rgba(255,255,255,.3);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--panel);border-bottom:1px solid var(--line);
  padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:18px;margin:0;}
.topbar .crumb{font-size:12px;color:var(--muted);margin-top:2px;}
#view{padding:24px 26px 60px;flex:1;}

/* ---------- Stat cards ---------- */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.stat-card .lbl{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px;}
.stat-card .val{font-family:'Almarai',sans-serif;font-size:23px;font-weight:800;color:var(--ink);}
.stat-card .sub{font-size:11px;color:var(--muted);margin-top:4px;}
.stat-card.accent-teal{border-top:3px solid var(--teal);}
.stat-card.accent-gold{border-top:3px solid var(--gold);}
.stat-card.accent-warn{border-top:3px solid var(--warning);}
.stat-card.accent-danger{border-top:3px solid var(--danger);}

/* ---------- Custody cards ---------- */
.custody-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:16px;}
.cus-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;position:relative;cursor:pointer;transition:border-color .15s, transform .1s;overflow:hidden;}
.cus-card:hover{border-color:var(--teal);transform:translateY(-2px);}
.cus-card .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;}
.cus-card .desc{font-weight:800;font-size:14.5px;color:var(--ink);margin:0 0 3px;font-family:'Almarai';}
.cus-card .who{font-size:12px;color:var(--muted);}
.cus-card .ring-wrap{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);}
.cus-card .figs{flex:1;}
.cus-card .figs .row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;}
.cus-card .figs .row b{font-weight:700;}
.overdue-flag{color:var(--danger);font-size:11px;font-weight:700;margin-top:6px;display:flex;align-items:center;gap:4px;}
.stamp{
  position:absolute;left:14px;bottom:14px;width:64px;height:64px;border-radius:50%;
  border:2.5px solid var(--danger);color:var(--danger);display:flex;align-items:center;justify-content:center;
  text-align:center;font-family:'Almarai';font-weight:800;font-size:10px;transform:rotate(-14deg);opacity:.8;
  line-height:1.15;
}
.stamp::before{content:'';position:absolute;inset:4px;border:1px solid var(--danger);border-radius:50%;}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
table.tbl th{background:var(--paper);color:var(--ink-2);font-weight:700;text-align:right;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;}
table.tbl td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
table.tbl tr:last-child td{border-bottom:none;}
table.tbl tbody tr:hover{background:var(--paper);}
.empty-row{padding:36px 20px;text-align:center;color:var(--muted);}
.empty-row .ico{font-size:26px;margin-bottom:8px;}

/* ---------- Home page: two-column layout, activity feed ---------- */
.grid-2col{display:grid;grid-template-columns:1.05fr 1fr;gap:22px;align-items:start;}
.block-title{font-size:14px;margin:0 0 10px;font-weight:800;}
.activity-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:12.5px;}
.activity-row:last-child{border-bottom:none;}
.activity-row:hover{background:var(--paper);}
.activity-row .ai{font-size:15px;flex-shrink:0;}
.activity-row .at{color:var(--ink);}
.activity-row .atime{color:var(--muted);font-size:11px;white-space:nowrap;flex-shrink:0;}
.clickable-row{cursor:pointer;}
@media(max-width:960px){ .grid-2col{grid-template-columns:1fr;} }

/* ---------- Cost center enum picker (add custody) ---------- */
.cc-combo{border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--paper);}
.cc-tags{display:flex;flex-wrap:wrap;gap:6px;}
.cc-tag{display:inline-flex;align-items:center;gap:6px;background:var(--teal);color:#fff;border-radius:100px;padding:5px 6px 5px 12px;font-size:12px;font-weight:700;}
.cc-tag button{background:rgba(255,255,255,.25);border:none;color:#fff;width:16px;height:16px;border-radius:50%;cursor:pointer;font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
.cc-tag button:hover{background:rgba(255,255,255,.45);}
.search-box.full-width{width:100%;}
.search-box.full-width input{width:100%;}
.cc-pick-list{border:1.5px solid var(--line);border-radius:10px;max-height:200px;overflow-y:auto;background:var(--panel);}
.cc-pick-row{display:flex;align-items:center;gap:9px;padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line-soft);}
.cc-pick-row:last-child{border-bottom:none;}
.cc-pick-row:hover{background:var(--teal-soft);}
.cc-pick-row input{width:16px;height:16px;accent-color:var(--teal);flex-shrink:0;}
.cc-pick-main{font-weight:800;background:var(--paper);}
.cc-pick-header{cursor:default;}
.cc-pick-header:hover{background:var(--paper);}
.cc-pick-empty{cursor:default;color:var(--muted);font-size:12px;}
.cc-pick-empty:hover{background:var(--panel);}
.cc-pick-sub{padding-right:34px;color:var(--ink-2);}

/* ---------- Federation group tree (auditor views) ---------- */
.fed-group{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
.fed-group-head{display:flex;align-items:center;gap:10px;padding:13px 18px;background:var(--paper);cursor:pointer;user-select:none;font-weight:800;font-size:14px;}
.fed-group-head:hover{background:var(--teal-soft);}
.fed-group-head .fed-name{flex:1;}
.fed-group-head.fed-open .cc-caret{transform:rotate(90deg);}
.fed-group-body{display:none;}
.fed-group-body.fed-open{display:block;}
.fed-group-body .tbl-wrap{border:none;border-radius:0;border-top:1px solid var(--line);}

/* ---------- Cost center tree ---------- */
.cc-forest{display:flex;flex-direction:column;gap:10px;}
.cc-tree{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.cc-node{display:flex;align-items:center;gap:10px;padding:12px 16px;}
.cc-main{background:var(--paper);font-size:13.5px;cursor:pointer;user-select:none;}
.cc-main:hover{background:var(--teal-soft);}
.cc-main .cc-ico{font-size:15px;}
.cc-caret{display:inline-block;font-size:11px;color:var(--muted);transition:transform .15s;width:10px;}
.cc-main.cc-open .cc-caret{transform:rotate(90deg);}
.cc-node .cc-name{flex:1;}
.cc-node .cc-spent{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2);}
.cc-children{padding:4px 0 8px;border-right:1.5px solid var(--line);margin-right:26px;display:none;}
.cc-children.cc-open{display:block;}
.cc-sub{position:relative;padding-right:22px;font-size:12.5px;margin-right:-1.5px;}
.cc-sub .cc-connector{position:absolute;right:0;top:0;width:16px;height:19px;border-bottom:1.5px solid var(--line);}
.cc-empty{color:var(--muted);}

/* ---------- Section header ---------- */
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.section-head h2{font-size:17px;margin:0;}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--gold);text-transform:uppercase;margin-bottom:4px;}

/* ---------- Tabs / filters ---------- */
.pill-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.pill-tab{padding:7px 14px;border-radius:100px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;}
.pill-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.search-box{position:relative;}
.search-box input{padding-right:32px;min-width:220px;}
.search-box .ico{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(14,34,51,.5);display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:100;overflow-y:auto;}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);animation:modalIn .18s ease;}
@keyframes modalIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.modal.modal-wide{max-width:820px;}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{margin:0;font-size:16px;}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--paper);border-radius:0 0 16px 16px;}
.modal-close{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;line-height:1;padding:4px;}
.modal-close:hover{color:var(--ink);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
.form-grid .full{grid-column:1/-1;}
.chip-select{display:flex;flex-wrap:wrap;gap:8px;}
.chip{border:1.5px solid var(--line);border-radius:100px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-2);background:var(--paper);user-select:none;}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;}
.divider{border:none;border-top:1px solid var(--line);margin:18px 0;}
.subhead{font-size:13px;font-weight:800;color:var(--ink-2);display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.subhead .n{background:var(--gold);color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;}
.line-item{display:grid;grid-template-columns:1.3fr 1.1fr .8fr 34px;gap:8px;align-items:center;margin-bottom:8px;}
.line-item select,.line-item input{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);width:100%;}
.rm-line{background:var(--danger-soft);color:var(--danger);border:none;border-radius:7px;width:34px;height:34px;cursor:pointer;font-weight:800;}
.lines-empty{padding:16px;text-align:center;color:var(--muted);font-size:12.5px;border:1.5px dashed var(--line);border-radius:9px;}

/* ---------- Detail page ---------- */
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;}
.detail-title{font-size:20px;font-weight:800;margin:0 0 6px;font-family:'Almarai';}
.kv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:16px;}
.kv-grid .kv-lbl{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px;}

<script>
/* =========================================================================
   نظام إدارة العهد النقدية — منطق التطبيق
   ========================================================================= */

const SCHEMA = {
  federations: ['federation_id','federation_name_ar','federation_name_en','image','created_by','created_at'],
  users: ['user_id','federation_id','user_status','employee_name_ar','employee_name_en','national_id','nationality','phone','email','user_name','password','user_type','Job_Title','language','created_at','created_by'],
  custodies: ['custody_id','federation_id','custody_status','received_by_user_id','custody_type','description_ar','description_en','disbursement_location','cost_center_id','Opening_balance','Custody_balance','Closing_date','created_by','created_at','request_approved_by','request_approval_date','closure_approved_by','closure_approval_date','Print_Count'],
  custody_closures: ['closure_id','federation_id','disbursement_status','user_id','custody_id','expense_type_id','cost_center_id','statement','currency','foreign_amount','exchange_rate','amount','file','entry_location','created_by','created_at','approved_by','approved_at'],
  custody_transfers: ['transfer_id','federation_id','transfer_status','user_id','custody_id','statement','currency','foreign_amount','exchange_rate','amount','file','created_at','created_by','approved_by','approved_at'],
  custody_budgets: ['budget_id','Record_Status','federation_id','custody_id','expense_type_id','cost_center_id','estimated_amount','created_by','created_at','approved_by','approved_at'],
  expense_types: ['account_number','expense_name_ar','expense_name_en','created_at','created_by'],
  cost_centers: ['cost_center_id','federation_id','parent_cost_center_id','cost_center_name_ar','cost_center_name_en','created_by','created_at']
};
const PK = {federations:'federation_id',users:'user_id',custodies:'custody_id',custody_closures:'closure_id',custody_transfers:'transfer_id',custody_budgets:'budget_id',expense_types:'account_number',cost_centers:'cost_center_id'};

const USER_TYPES = ['مراجع','رئيس الاتحاد','مدير تنفيذي','محاسب','موظف'];
const USER_STATUSES = ['مفتوح','مغلق','تحت المعالجة','مسودة'];
const CUSTODY_TYPES = ['عهدة نقدية دائمة','عهدة نقدية مؤقتة'];
const CURRENCIES = ['SAR','USD','EUR','AED','GBP'];
const MAIN_COST_CENTERS = ['فني','تشغيلي','المعسكرات الداخلية','المعسكرات الخارجية','البطولات الداخلية','البطولات الخارجية','الأنشطة والمبادرات الأخرى'];

let DB = null;      // { federations:[...], users:[...], ... }
let Session = { user:null, view:'dashboard', params:{}, fileName:'' };

/* ---------------------------- Utilities ---------------------------- */
function uid(prefix){ return prefix + Math.random().toString(16).slice(2,10); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(d){
  if(!d) return '—';
  try{
    const dt = (d instanceof Date) ? d : new Date(d);
    if(isNaN(dt.getTime())) return String(d);
    return dt.toLocaleDateString('ar-SA',{year:'numeric',month:'short',day:'numeric'});
  }catch(e){ return String(d); }
}
function fmtDateTime(d){
  if(!d) return '—';
  try{
    const dt = (d instanceof Date) ? d : new Date(d);
    if(isNaN(dt.getTime())) return String(d);
    return dt.toLocaleString('ar-SA',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  }catch(e){ return String(d); }
}
function money(n){
  n = Number(n||0);
  return n.toLocaleString('ar-SA',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ر.س';
}
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, kind){
  const root = document.getElementById('toastRoot');
  const box = document.createElement('div');
  box.className = 'toast';
  if(kind==='danger') box.style.background = 'var(--danger)';
  if(kind==='success') box.style.background = 'var(--success)';
  box.textContent = msg;
  root.appendChild(box);
  setTimeout(()=>{ box.style.transition='opacity .3s'; box.style.opacity='0'; setTimeout(()=>box.remove(),300); }, 2600);
}

/* ---------------------------- Permissions ---------------------------- */
const Perm = {
  isAuditor: u => u && u.user_type === 'مراجع',
  isPresident: u => u && u.user_type === 'رئيس الاتحاد',
  isExec: u => u && u.user_type === 'مدير تنفيذي',
  isAccountant: u => u && u.user_type === 'محاسب',
  isEmployee: u => u && u.user_type === 'موظف',
  isTopApprover: u => Perm.isPresident(u) || Perm.isExec(u),
  canManageUsers: u => !Perm.isEmployee(u),
  canChangeUserStatus: u => Perm.isTopApprover(u),
  canEditUser: (u,target) => target && target.user_status==='تحت المعالجة' && (Perm.isTopApprover(u)||Perm.isAccountant(u)) && target.federation_id===u.federation_id,
  canManageCostCenters: u => Perm.isAccountant(u) || Perm.isTopApprover(u),
  canAddExpenseType: u => Perm.isAuditor(u),
  canRequestCustody: u => !Perm.isAuditor(u),
  canApproveCustodyRequest: u => Perm.isTopApprover(u),
  canEditCustody: (u,c) => c && c.custody_status==='قيد الاعتماد' && u.federation_id===c.federation_id && (u.user_id===c.created_by || Perm.isTopApprover(u) || Perm.isAccountant(u)),
  canEditBudgetLine: (u,c,b) => c && b && b.Record_Status==='قيد الاعتماد' && u.federation_id===c.federation_id && (u.user_id===c.created_by || Perm.isTopApprover(u) || Perm.isAccountant(u)),
  canEditExpense: (u,c,e) => c && e && e.disbursement_status==='غير معتمد' && u.federation_id===c.federation_id && (u.user_id===e.created_by || Perm.isTopApprover(u) || Perm.isAccountant(u)),
  canTransfer: u => Perm.isAccountant(u) || Perm.isTopApprover(u),
  canApproveExpense: u => Perm.isAccountant(u) || Perm.isExec(u),
  canCloseCustody: u => Perm.isTopApprover(u),
};

/* ---------------------------- Scoped data ---------------------------- */
function visibleCustodies(u){
  if(!u) return [];
  if(Perm.isAuditor(u)) return DB.custodies.slice();
  if(Perm.isEmployee(u)) return DB.custodies.filter(c=>c.federation_id===u.federation_id && c.received_by_user_id===u.user_id);
  return DB.custodies.filter(c=>c.federation_id===u.federation_id);
}
function visibleUsers(u){
  if(!u) return [];
  if(Perm.isAuditor(u)) return DB.users.slice();
  return DB.users.filter(x=>x.federation_id===u.federation_id);
}
function visibleCostCenters(u){
  if(!u) return [];
  if(Perm.isAuditor(u)) return DB.cost_centers.slice();
  return DB.cost_centers.filter(x=>x.federation_id===u.federation_id);
}
function visibleCustodyIds(u){ return new Set(visibleCustodies(u).map(c=>c.custody_id)); }
function costCenterSpent(ccId){
  return DB.custody_closures.filter(e=>e.cost_center_id===ccId && e.disbursement_status==='معتمد').reduce((s,e)=>s+Number(e.amount||0),0);
}
function federationById(id){ return DB.federations.find(f=>f.federation_id===id); }
function userById(id){ return DB.users.find(x=>x.user_id===id); }
function userLabel(id){
  const u = userById(id);
  if(!u) return '—';
  return u.employee_name_ar || u.user_name || '—';
}
function costCenterLabel(id){
  const c = DB.cost_centers.find(x=>x.cost_center_id===id);
  return c ? c.cost_center_name_ar : '—';
}
function expenseTypeLabel(id){
  const e = DB.expense_types.find(x=>x.account_number===id);
  return e ? e.expense_name_ar : '—';
}
function custodyCostCenterIds(c){
  return (c.cost_center_id || '').split(',').map(s=>s.trim()).filter(Boolean);
}

/* ---------------------------- Financial computations ---------------------------- */
function custodyFinancials(c){
  const budgets = DB.custody_budgets.filter(b=>b.custody_id===c.custody_id);
  const activeBudgets = budgets.filter(b=>b.Record_Status!=='ملغى');
  const totalBudget = activeBudgets.reduce((s,b)=>s+Number(b.estimated_amount||0),0);
  const approvedBudget = budgets.filter(b=>b.Record_Status==='معتمد').reduce((s,b)=>s+Number(b.estimated_amount||0),0);
  const pendingBudgetLines = budgets.filter(b=>b.Record_Status==='قيد الاعتماد');
  const transfers = DB.custody_transfers.filter(t=>t.custody_id===c.custody_id);
  const totalTransferred = transfers.reduce((s,t)=>s+Number(t.amount||0),0);
  const expenses = DB.custody_closures.filter(e=>e.custody_id===c.custody_id);
  const approvedExpenses = expenses.filter(e=>e.disbursement_status==='معتمد').reduce((s,e)=>s+Number(e.amount||0),0);
  const pendingExpenses = expenses.filter(e=>e.disbursement_status==='غير معتمد').reduce((s,e)=>s+Number(e.amount||0),0);
  const pendingExpenseCount = expenses.filter(e=>e.disbursement_status==='غير معتمد').length;
  const opening = Number(c.Opening_balance||0);
  const fundsAvailable = opening + totalTransferred;
  const remainingBalance = fundsAvailable - approvedExpenses;
  const availableToSpend = remainingBalance - pendingExpenses; // يحجز مبالغ المصاريف غير المعتمدة بعد حتى لا يُطلب أكثر من المتاح فعليًا
  const pendingTransfer = Math.max(0, approvedBudget - fundsAvailable);
  const spentPct = approvedBudget>0 ? Math.min(100, Math.round(approvedExpenses/approvedBudget*100)) : 0;
  return {budgets,activeBudgets,totalBudget,approvedBudget,pendingBudgetLines,transfers,totalTransferred,expenses,approvedExpenses,pendingExpenses,
           pendingExpenseCount,opening,fundsAvailable,remainingBalance,availableToSpend,pendingTransfer,spentPct};
}
function custodyWaitingLabel(c){
  if(c.custody_status==='مرفوضة') return {text:'مرفوضة', cls:'danger'};
  if(c.custody_status==='مغلقة') return {text:'مغلقة', cls:'muted'};
  if(c.custody_status==='قيد الاعتماد') return {text:'بانتظار اعتماد الطلب', cls:'warning'};
  const f = custodyFinancials(c);
  if(f.pendingTransfer>0) return {text:'بانتظار التحويل', cls:'gold'};
  if(f.pendingExpenseCount>0) return {text:'بانتظار اعتماد مصروف', cls:'warning'};
  if(f.pendingBudgetLines.length>0) return {text:'بانتظار اعتماد مصروف تقديري', cls:'warning'};
  if(f.remainingBalance===0 && f.approvedExpenses>0) return {text:'بانتظار الإقفال', cls:'success'};
  return {text:'قيد الصرف', cls:'info'};
}
function isOverdue(c){
  if(!c.Closing_date || c.custody_status==='مغلقة') return false;
  const d = new Date(c.Closing_date);
  if(isNaN(d.getTime())) return false;
  return d.getTime() < Date.now();
}

/* ---------------------------- Per-user custody summary ---------------------------- */
function userOpenBalance(userId){
  return DB.custodies.filter(c=>c.received_by_user_id===userId && c.custody_status==='مفتوحة')
    .reduce((s,c)=> s + custodyFinancials(c).remainingBalance, 0);
}
function userCustodySummary(userId){
  const custodies = DB.custodies.filter(c=>c.received_by_user_id===userId)
    .slice().sort((a,b)=> new Date(b.created_at||0) - new Date(a.created_at||0));
  let approvedBudget=0, approvedExpenses=0, remainingBalance=0, openCount=0, closedCount=0, pendingCount=0;
  const ccUsage = {}; // cost_center_id -> amount
  custodies.forEach(c=>{
    const f = custodyFinancials(c);
    approvedBudget += f.approvedBudget;
    approvedExpenses += f.approvedExpenses;
    if(c.custody_status==='مفتوحة'){ remainingBalance += f.remainingBalance; openCount++; }
    else if(c.custody_status==='مغلقة') closedCount++;
    else if(c.custody_status==='قيد الاعتماد') pendingCount++;
    f.expenses.filter(e=>e.disbursement_status==='معتمد').forEach(e=>{
      ccUsage[e.cost_center_id] = (ccUsage[e.cost_center_id]||0) + Number(e.amount||0);
    });
  });
  const costCentersUsed = Object.keys(ccUsage).map(id=>({ id, name: costCenterLabel(id), amount: ccUsage[id] }))
    .sort((a,b)=> b.amount - a.amount);
  return { custodies, approvedBudget, approvedExpenses, remainingBalance, openCount, closedCount, pendingCount, costCentersUsed };
}

/* ---------------------------- Badge helpers ---------------------------- */
function userStatusBadge(s){
  const map = {'مفتوح':'success','مغلق':'muted','تحت المعالجة':'warning','مسودة':'muted'};
  return `<span class="badge badge-${map[s]||'muted'}">${esc(s||'—')}</span>`;
}
function custodyStatusBadge(s){
  const map = {'قيد الاعتماد':'warning','مفتوحة':'success','مغلقة':'muted','مرفوضة':'danger'};
  return `<span class="badge badge-${map[s]||'muted'}">${esc(s||'—')}</span>`;
}
function expenseStatusBadge(s){
  const map = {'معتمد':'success','غير معتمد':'warning','ملغى':'danger'};
  return `<span class="badge badge-${map[s]||'muted'}">${esc(s||'—')}</span>`;
}
function budgetStatusBadge(s){
  const map = {'معتمد':'success','قيد الاعتماد':'warning','ملغى':'danger'};
  return `<span class="badge badge-${map[s]||'muted'}">${esc(s||'—')}</span>`;
}
/* =========================================================================
   طبقة الاتصال بالخادم — المتصفح لا يعرف شيئًا عن Supabase إطلاقًا.
   كل طلب يمر عبر مسار واحد على خادمنا: POST /api/db
   ========================================================================= */
async function apiCall(body){
  let res;
  try{
    res = await fetch('/api/db', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  }catch(e){
    return { data: null, error: { message: 'تعذّر الاتصال بالخادم. تأكد من اتصالك بالإنترنت.' } };
  }
  try{
    return await res.json();
  }catch(e){
    return { data: null, error: { message: 'استجابة غير متوقعة من الخادم (رمز الحالة: '+res.status+')' } };
  }
}

/* جدول القراءة لـ users يذهب دائمًا عبر "users_public" (بدون كلمة المرور) */
const READ_SOURCE = { users: 'users_public' };
function readSource(table){ return READ_SOURCE[table] || table; }

/* ---------------------------- Attachments (upload / view) ---------------------------- */
async function apiUpload(file, folder){
  const fd = new FormData();
  fd.append('file', file);
  fd.append('folder', folder);
  let res;
  try{
    res = await fetch('/api/upload', { method:'POST', body: fd });
  }catch(e){
    return { data:null, error:{ message:'تعذّر رفع الملف — تحقق من اتصالك بالإنترنت.' } };
  }
  try{ return await res.json(); }
  catch(e){ return { data:null, error:{ message:'استجابة غير متوقعة أثناء رفع الملف' } }; }
}
async function viewAttachment(filePath){
  if(!filePath){ toast('لا يوجد مرفق لهذا السجل','danger'); return; }
  let res;
  try{
    res = await fetch('/api/file-url', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ path: filePath }) });
  }catch(e){ toast('تعذّر الاتصال بالخادم','danger'); return; }
  let json;
  try{ json = await res.json(); } catch(e){ toast('استجابة غير متوقعة من الخادم','danger'); return; }
  if(json.error){ toast('تعذّر فتح المرفق: ' + json.error.message, 'danger'); return; }
  window.open(json.data.url, '_blank');
}
function locationBtnHTML(loc){
  if(!loc || !/^https?:\/\//.test(loc)) return '';
  return `<button class="btn btn-ghost btn-sm" onclick="window.open('${esc(loc)}','_blank')" title="فتح الموقع على الخريطة">📍 الموقع</button>`;
}
function attachBtnHTML(filePath){
  if(!filePath) return '';
  return `<button class="btn btn-ghost btn-sm" onclick="viewAttachment('${esc(filePath)}')" title="عرض المرفق">📎 المرفق</button>`;
}

/* ---------------------------- Bulk load ---------------------------- */
async function loadAllData(){
  const tables = Object.keys(SCHEMA);
  const results = await Promise.all(tables.map(t => apiCall({ op:'select', table: readSource(t) })));
  const out = {};
  for(let i=0;i<tables.length;i++){
    if(results[i].error){ throw new Error(`تعذّرت قراءة جدول ${tables[i]}: ${results[i].error.message}`); }
    out[tables[i]] = results[i].data || [];
  }
  return out;
}

/* ---------------------------- Generic write helpers ---------------------------- */
/* لكل الجداول ما عدا "users" (لها معالجة خاصة أدناه) */
async function dbInsert(table, obj){
  const { data, error } = await apiCall({ op:'insert', table, payload: obj, returning: true });
  if(error){ toast('تعذّر الحفظ: ' + error.message, 'danger'); return null; }
  DB[table].push(data);
  return data;
}
async function dbUpdate(table, pkField, id, patch){
  const { data, error } = await apiCall({ op:'update', table, pkField, id, patch, returning: true });
  if(error){ toast('تعذّر التحديث: ' + error.message, 'danger'); return null; }
  const idx = DB[table].findIndex(r => r[pkField] === id);
  if(idx >= 0) DB[table][idx] = data;
  return data;
}

/* "users" لا نطلب إرجاع الصف بعد الكتابة (لتفادي أي احتمال لتسريب كلمة
   المرور في الاستجابة)، بل ندمج القيم التي أرسلناها في الحالة المحلية مباشرة. */
async function dbInsertUser(obj){
  const { error } = await apiCall({ op:'insert', table:'users', payload: obj, returning: false });
  if(error){ toast('تعذّر حفظ المستخدم: ' + error.message, 'danger'); return null; }
  DB.users.push(obj);
  return obj;
}
async function dbUpdateUser(userId, patch){
  const { error } = await apiCall({ op:'update', table:'users', pkField:'user_id', id:userId, patch, returning: false });
  if(error){ toast('تعذّر تحديث المستخدم: ' + error.message, 'danger'); return null; }
  const idx = DB.users.findIndex(r => r.user_id === userId);
  if(idx >= 0) Object.assign(DB.users[idx], patch);
  return idx >= 0 ? DB.users[idx] : patch;
}

/* ---------------------------- Seeding (runs once, persists to Supabase) ---------------------------- */
async function seedDefaultCostCenters(){
  for(const f of DB.federations){
    const existingNames = new Set(DB.cost_centers.filter(c=>c.federation_id===f.federation_id).map(c=>c.cost_center_name_ar));
    for(const name of MAIN_COST_CENTERS){
      if(!existingNames.has(name)){
        await dbInsert('cost_centers', {
          cost_center_id: uid('cc'), federation_id: f.federation_id, parent_cost_center_id: null,
          cost_center_name_ar: name, cost_center_name_en: name, created_by:'system', created_at: nowISO()
        });
      }
    }
  }
}

function visibleDataForExport(){
  const u = Session.user;
  if(!u || Perm.isAuditor(u)){
    // المراجع (أو حالة غير متوقعة) يرى كل شيء
    return DB;
  }
  const custodies = visibleCustodies(u);
  const custodyIds = new Set(custodies.map(c=>c.custody_id));
  return {
    federations: DB.federations.filter(f=>f.federation_id===u.federation_id),
    users: visibleUsers(u),
    cost_centers: visibleCostCenters(u),
    expense_types: DB.expense_types, // موحّدة لكل الاتحادات، لا حاجة لتقييدها
    custodies: custodies,
    custody_budgets: DB.custody_budgets.filter(b=>custodyIds.has(b.custody_id)),
    custody_transfers: DB.custody_transfers.filter(t=>custodyIds.has(t.custody_id)),
    custody_closures: DB.custody_closures.filter(e=>custodyIds.has(e.custody_id)),
  };
}
function exportWorkbook(){
  const scoped = visibleDataForExport();
  const wb = XLSX.utils.book_new();
  Object.keys(SCHEMA).forEach(sheetName=>{
    const headers = SCHEMA[sheetName];
    const rows = (scoped[sheetName]||[]).map(r=>{
      const row = {};
      headers.forEach(h=>{ row[h] = (r[h]===undefined) ? null : r[h]; });
      return row;
    });
    const ws = XLSX.utils.json_to_sheet(rows, {header:headers});
    XLSX.utils.sheet_add_aoa(ws, [headers], {origin:'A1'});
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  XLSX.writeFile(wb, 'custody-backup-' + stamp + '.xlsx');
}

App.login = async function(){
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const alertEl = document.getElementById('loginAlert');
  const btn = document.getElementById('loginBtn');
  alertEl.innerHTML = '';

    alertEl.innerHTML = `<div class="alert alert-danger">الرجاء إدخال اسم المستخدم وكلمة المرور.</div>`;
    return;
  }
  btn.disabled = true; btn.textContent = 'جارٍ التحقق…';
  const { data, error } = await apiCall({ op:'rpc', fn:'login', args:{ p_username: username, p_password: password } });

  if(error){

    alertEl.innerHTML = `<div class="alert alert-danger">اسم المستخدم أو كلمة المرور غير صحيحة.</div>`;

  Session.view = 'dashboard';

  document.getElementById('app-shell').classList.remove('hidden');

function ringSVG(pct, size, color){
  size = size || 54;
  const r = (size/2)-5;
  const c = 2*Math.PI*r;
  const off = c - (pct/100)*c;
  return `<svg class="ring-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="5"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="53%" text-anchor="middle" dominant-baseline="middle" font-size="${size*0.24}" font-weight="800" fill="var(--ink)" font-family="Almarai">${pct}%</text>
  </svg>`;
}
function barHTML(pct, color, w){
  w = w || 84;
  return `<div style="background:var(--line-soft);border-radius:6px;height:7px;width:${w}px;overflow:hidden;" title="${pct}%">
    <div style="width:${Math.min(100,pct)}%;height:100%;background:${color};"></div>

}

/* مكوّن مشترك: تجميع أي قائمة حسب الاتحاد وعرضها كشجرة قابلة للطي (لصلاحية المراجع) */
function renderFederationTree(items, getFedId, renderBodyFn){
  const groups = {};
  items.forEach(it=>{
    const fid = getFedId(it) || '—';
    if(!groups[fid]) groups[fid] = [];
    groups[fid].push(it);
  });
  const fedIds = Object.keys(groups).sort((a,b)=>{
    const fa = federationById(a), fb = federationById(b);
    return (fa?fa.federation_name_ar:'').localeCompare(fb?fb.federation_name_ar:'', 'ar');
  });
  if(!fedIds.length) return `<div class="empty-row">لا توجد بيانات</div>`;
  return fedIds.map(fid=>{
    const fed = federationById(fid);
    return `<div class="fed-group">
      <div class="fed-group-head fed-open" onclick="this.classList.toggle('fed-open');this.nextElementSibling.classList.toggle('fed-open')">
        <span class="cc-caret">▸</span>
        <span class="fed-name">🏛️ ${esc(fed?fed.federation_name_ar:'—')}</span>
        <span class="badge badge-muted">${groups[fid].length}</span>
      </div>
      <div class="fed-group-body fed-open">${renderBodyFn(groups[fid])}</div>
    </div>`;
  }).join('');
}

    <div class="stat-card"><div class="lbl">التحويلات</div><div class="val num">${transfers.length}</div><div class="sub">بإجمالي ${money(tAmt)}</div></div>
    <div class="stat-card accent-danger"><div class="lbl">المصاريف الفعلية</div><div class="val num">${expenses.length}</div>
      <div class="sub">${ePending.length} بانتظار الاعتماد · ${eApproved.length} معتمدة</div></div>
    <div class="stat-card"><div class="lbl">إجمالي المصروف الفعلي المعتمد</div><div class="val num">${money(eApprovedAmt)}</div></div>
    ${(Perm.canManageUsers(u)||Perm.isAuditor(u)) ? `<div class="stat-card ${usersPending.length?'accent-warn':''}"><div class="lbl">حسابات بانتظار الاعتماد</div><div class="val num">${usersPending.length}</div></div>` : ''}
  </div>`;

  /* ---- pending operations ---- */
  const pendingBlocks = [];
  if(usersPending.length && (Perm.canManageUsers(u)||Perm.isAuditor(u))){
    pendingBlocks.push(pendingBlock('حسابات بانتظار الاعتماد', usersPending.map(x=>({
      text: x.employee_name_ar + ' — ' + x.user_type, time:x.created_at, onclick:`App.go('users')`
    })), '👥'));
  }
  pendingBlocks.push(pendingBlock('العهد قيد الاعتماد', cPending.map(c=>({
    text: (c.description_ar||'بدون وصف') + ' — ' + userLabel(c.received_by_user_id),
    time: c.created_at, onclick:`App.go('custodyDetail',{id:'${c.custody_id}'})`
  })), '💼'));
  pendingBlocks.push(pendingBlock('مصاريف تقديرية بانتظار الاعتماد', bRefeedPending.map(b=>{
    const c = DB.custodies.find(x=>x.custody_id===b.custody_id);
    return {text:(c?c.description_ar:'—') + ' — ' + expenseTypeLabel(b.expense_type_id) + ' — ' + money(b.estimated_amount), time:b.created_at, onclick:`App.go('custodyDetail',{id:'${b.custody_id}'})`};
  }), '📋'));
  pendingBlocks.push(pendingBlock('تحويلات في الانتظار', cNeedsTransfer.map(c=>{
    const f = custodyFinancials(c);
    return {text:(c.description_ar||'بدون وصف') + ' — متبقٍ ' + money(f.pendingTransfer), time:c.request_approval_date, onclick:`App.go('custodyDetail',{id:'${c.custody_id}'})`};
  }), '⭳'));
  pendingBlocks.push(pendingBlock('مصاريف بانتظار الاعتماد', ePending.map(e=>({
    text: expenseTypeLabel(e.expense_type_id) + ' — ' + money(e.amount) + ' — ' + userLabel(e.created_by),
    time: e.created_at, onclick:`App.go('custodyDetail',{id:'${e.custody_id}'})`
  })), '🧾'));

  /* ---- custodies in progress with their next-step label ---- */
  const inProgressHTML = cInProgress.length ? cInProgress.slice().sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0)).slice(0,8).map(c=>{
    const w = custodyWaitingLabel(c);
    return `<div class="activity-row" onclick="App.go('custodyDetail',{id:'${c.custody_id}'})">
      <span class="ai">💼</span>
      <span class="at grow">${esc(c.description_ar||'—')} — ${esc(userLabel(c.received_by_user_id))}</span>
      <span class="badge badge-${w.cls}">${esc(w.text)}</span>
    </div>`;
  }).join('') : `<div class="empty-row">لا توجد عهد قيد التنفيذ حاليًا</div>`;

  /* ---- recent activity feed ---- */
  const events = [];
  activeCustodies.forEach(c=>{
    events.push({t:c.created_at, ico:'💼', text:`طلب عهدة جديد: ${c.description_ar||'—'} بواسطة ${userLabel(c.created_by)}`, go:c.custody_id});
    if(c.request_approval_date) events.push({t:c.request_approval_date, ico:'✅', text:`اعتماد طلب عهدة: ${c.description_ar||'—'} بواسطة ${userLabel(c.request_approved_by)}`, go:c.custody_id});
    if(c.closure_approval_date) events.push({t:c.closure_approval_date, ico:'🔒', text:`إقفال عهدة: ${c.description_ar||'—'} بواسطة ${userLabel(c.closure_approved_by)}`, go:c.custody_id});
  });
  transfers.forEach(t=>events.push({t:t.created_at, ico:'⭳', text:`تحويل ${money(t.amount)} إلى عهدة بواسطة ${userLabel(t.created_by)}`, go:t.custody_id}));
  expenses.forEach(e=>{
    events.push({t:e.created_at, ico:'🧾', text:`تسجيل مصروف ${money(e.amount)} (${expenseTypeLabel(e.expense_type_id)}) بواسطة ${userLabel(e.created_by)}`, go:e.custody_id});
    if(e.approved_at) events.push({t:e.approved_at, ico:'✅', text:`اعتماد مصروف ${money(e.amount)} بواسطة ${userLabel(e.approved_by)}`, go:e.custody_id});
  });
  events.sort((a,b)=> new Date(b.t||0) - new Date(a.t||0));
  const recentHTML = events.slice(0,10).map(ev=>`
    <div class="activity-row" onclick="App.go('custodyDetail',{id:'${ev.go}'})">
      <span class="ai">${ev.ico}</span>
      <span class="at grow">${esc(ev.text)}</span>
      <span class="atime">${fmtDateTime(ev.t)}</span>
    </div>`).join('') || `<div class="empty-row">لا توجد حركات بعد</div>`;

  return `
    <div class="section-head">
      <div><div class="eyebrow">نظرة شاملة</div><h2>مرحبًا، ${esc(u.employee_name_ar||u.user_name)}</h2></div>
      <div class="flex gap-8 wrap">${quickActions.join('')}</div>
    </div>
    ${stats}
    <div class="grid-2col mt-24">
      <div>
        <h3 class="block-title">عمليات بانتظار الإجراء</h3>
        ${pendingBlocks.join('') || `<div class="card card-pad empty-row">لا توجد عمليات معلّقة 🎉</div>`}
      </div>
      <div>
        <h3 class="block-title">العهد قيد التنفيذ</h3>
        <div class="card">${inProgressHTML}</div>
        <h3 class="block-title mt-16">آخر الحركات</h3>
        <div class="card">${recentHTML}</div>
      </div>
    </div>
  `;
};

function pendingBlock(title, items, ico){
  if(!items.length) return '';
  const rows = items.slice(0,6).map(it=>`
    <div class="activity-row" onclick="${it.onclick}">
      <span class="ai">${ico}</span>
      <span class="at grow">${esc(it.text)}</span>
      <span class="atime">${fmtDate(it.time)}</span>
    </div>`).join('');
  return `<div class="card mt-12">
    <div class="card-pad" style="padding:12px 16px 0;"><b style="font-size:13px;">${esc(title)}</b> <span class="badge badge-warning" style="margin-right:6px;">${items.length}</span></div>
    <div class="mt-8">${rows}</div>
  </div>`;
}

const Modals = {};
let CustodyDraft = null;
let CCPickerQuery = '';

function isCustodyDraftValid(d){
  if(!d.description_ar.trim() || !d.description_en.trim() || !d.disbursement_location.trim() || !d.Closing_date) return false;
  if(!d.cost_centers.length) return false;
  if(!d.lines.length) return false;
  return d.lines.every(l=> l.expense_type_id && l.cost_center_id && l.estimated_amount && Number(l.estimated_amount)>0);
}

function renderCostCenterPicker(fedCC, selected){
  if(!fedCC.length){
    return `<div class="muted small">لا توجد مراكز تكلفة لهذا الاتحاد بعد. أضف مراكز التكلفة أولاً من القائمة الجانبية.</div>`;
  }
  const tagsHTML = renderCCTags(fedCC, selected);
  const rowsHTML = renderCCRows(fedCC, selected, CCPickerQuery);
  return `
    <div class="cc-combo">
      <div id="ccTagsWrap">${tagsHTML}</div>
      <div class="search-box full-width">
        <input type="text" placeholder="ابحث عن مركز تكلفة…" value="${esc(CCPickerQuery)}" oninput="Modals.setCCQuery(this.value)">
        <span class="ico">🔎</span>
      </div>
      <div class="cc-pick-list mt-8" id="ccPickList">${rowsHTML}</div>
    </div>
  `;
}

function renderCCTags(fedCC, selected){
  if(!selected.length) return `<div class="muted small mb-8">لم يتم اختيار أي مركز تكلفة بعد</div>`;
  return `<div class="cc-tags mb-8">${selected.map(id=>{
    const cc = fedCC.find(c=>c.cost_center_id===id);
    if(!cc) return '';
    return `<span class="cc-tag">${esc(cc.cost_center_name_ar)}<button type="button" onclick="Modals.toggleDraftCC('${id}')" title="إزالة">✕</button></span>`;
  }).join('')}</div>`;
}

function renderCCRows(fedCC, selected, query){
  const q = (query||'').trim().toLowerCase();
  const mains = fedCC.filter(cc=>!cc.parent_cost_center_id)
    .sort((a,b)=> MAIN_COST_CENTERS.indexOf(a.cost_center_name_ar) - MAIN_COST_CENTERS.indexOf(b.cost_center_name_ar));
  const rows = mains.map(m=>{
    const subs = fedCC.filter(cc=>cc.parent_cost_center_id===m.cost_center_id);
    const mainMatches = !q || m.cost_center_name_ar.toLowerCase().includes(q);
    const matchingSubs = subs.filter(s=> !q || mainMatches || s.cost_center_name_ar.toLowerCase().includes(q));
    if(q && !mainMatches && matchingSubs.length===0) return '';
    const headerRow = `<div class="cc-pick-row cc-pick-main cc-pick-header"><span>${esc(m.cost_center_name_ar)}</span></div>`;
    const subRows = matchingSubs.length
      ? matchingSubs.map(s=>`<label class="cc-pick-row cc-pick-sub">
          <input type="checkbox" ${selected.includes(s.cost_center_id)?'checked':''} onchange="Modals.toggleDraftCC('${s.cost_center_id}')">
          <span>${esc(s.cost_center_name_ar)}</span>
        </label>`).join('')
      : `<div class="cc-pick-row cc-pick-sub cc-pick-empty">لا توجد مراكز فرعية بعد — أضفها من صفحة مراكز التكلفة</div>`;
    return headerRow + subRows;

function renderBudgetLinesEditor(){
  const d = CustodyDraft;
  const ccOptionsBase = d.cost_centers.length ? d.cost_centers : [];
  const ccList = ccOptionsBase.map(id=>DB.cost_centers.find(c=>c.cost_center_id===id)).filter(Boolean);
  const etList = DB.expense_types;
  if(!ccList.length){
    return `<div class="lines-empty">حدد مركز تكلفة واحدًا على الأقل أعلاه لتتمكن من إضافة بنود المصاريف التقديرية.</div>`;
  }
  const rows = d.lines.map((line,idx)=>{
    const etOpts = etList.map(et=>`<option value="${et.account_number}" ${line.expense_type_id===et.account_number?'selected':''}>${esc(et.expense_name_ar)}</option>`).join('');
    const ccOpts = ccList.map(cc=>`<option value="${cc.cost_center_id}" ${line.cost_center_id===cc.cost_center_id?'selected':''}>${esc(cc.cost_center_name_ar)}</option>`).join('');
    return `<div class="line-item">
      <select onchange="Modals.updateLine(${idx},'expense_type_id',this.value)">${etOpts}</select>
      <select onchange="Modals.updateLine(${idx},'cost_center_id',this.value)">${ccOpts}</select>
      <input type="number" min="0" step="0.01" placeholder="المبلغ" value="${line.estimated_amount}" oninput="Modals.updateLine(${idx},'estimated_amount',this.value)">
      <button class="rm-line" onclick="Modals.removeLine(${idx})" title="حذف">✕</button>
    </div>`;
  }).join('');
  const total = d.lines.reduce((s,l)=>s+Number(l.estimated_amount||0),0);
  return `
    ${rows || `<div class="lines-empty">لا توجد بنود بعد — اضغط "إضافة بند" أدناه.</div>`}
    <button class="btn btn-outline btn-sm mt-8" onclick="Modals.addLine()">+ إضافة بند مصروف تقديري</button>
    ${d.lines.length ? `<div class="mt-12 flex between" style="font-weight:800;"><span>الإجمالي التقديري</span><span class="num" id="linesTotalAmount">${money(total)}</span></div>` : ''}
  `;
}

Modals.updateDraftField = function(key, val){

Modals.updateLine = function(idx, key, val){
  CustodyDraft.lines[idx][key] = val;
  if(key!=='estimated_amount') { refreshAddCustodyModal(); return; }

/* التقاط موقع الجهاز تلقائيًا عبر متصفح المستخدم ووضعه في حقل نصي للقراءة فقط */
function captureLocationInto(fieldId){
  const el = document.getElementById(fieldId);
  if(!el) return;
  if(!navigator.geolocation){
    el.value = 'تحديد الموقع غير مدعوم في هذا المتصفح';
    return;
  }
  navigator.geolocation.getCurrentPosition(
    function(pos){
      const el2 = document.getElementById(fieldId);
      if(!el2) return; // قد تكون النافذة أُغلقت قبل استجابة المتصفح
      const lat = pos.coords.latitude.toFixed(6);
      const lng = pos.coords.longitude.toFixed(6);
      el2.value = `https://www.google.com/maps?q=${lat},${lng}`;
    },
    function(){
      const el2 = document.getElementById(fieldId);
      if(!el2) return;
      el2.value = 'تعذّر تحديد الموقع — تأكد من السماح للمتصفح بالوصول لموقعك';
    },
    { enableHighAccuracy:true, timeout:10000, maximumAge:60000 }
  );
};

/* ============================= Custody picker (for home quick actions) ============================= */
Modals.pickCustody = function(kind){
  const u = Session.user;
  const titles = {feed:'اختر عهدة لطلب تغذية إضافية', expense:'اختر عهدة لتسجيل مصروف', transfer:'اختر عهدة لتحويل رصيد'};
  let eligible = visibleCustodies(u).filter(c=>c.federation_id===u.federation_id);
  if(kind==='feed'){
    eligible = eligible.filter(c=> c.custody_status!=='مغلقة' && c.custody_status!=='مرفوضة' && !Perm.isAuditor(u));
  } else if(kind==='expense'){
    eligible = eligible.filter(c=> c.custody_status==='مفتوحة' && custodyFinancials(c).availableToSpend>0 && (u.user_id===c.received_by_user_id || Perm.isAccountant(u)));
  } else if(kind==='transfer'){
    eligible = eligible.filter(c=> c.custody_status==='مفتوحة' && custodyFinancials(c).pendingTransfer>0 && Perm.canTransfer(u) && u.user_id!==c.request_approved_by);
  }
  window.__pickCustodyKind = kind;
  const rows = eligible.length ? eligible.map(c=>{
    const f = custodyFinancials(c);
    const extra = kind==='transfer' ? `متبقٍ للتحويل: ${money(f.pendingTransfer)}` : (kind==='expense' ? `الرصيد المتاح: ${money(Math.max(0,f.availableToSpend))}` : '');
    return `<div class="activity-row" onclick="Modals.runPickAction('${c.custody_id}')">
      <span class="ai">💼</span>
      <span class="at grow"><b>${esc(c.description_ar||'—')}</b> — ${esc(userLabel(c.received_by_user_id))}<br><span class="muted small">${esc(extra)}</span></span>
      <span class="atime">${custodyStatusBadge(c.custody_status)}</span>
    </div>`;
  }).join('') : `<div class="empty-row">لا توجد عهد مؤهلة لهذا الإجراء حاليًا</div>`;
  openModalHTML(modalShell('pickCustodyModal', titles[kind]||'اختر عهدة', `<div class="card" style="border:none;box-shadow:none;">${rows}</div>`, false, ''));
};
Modals.runPickAction = function(custodyId){
  closeModal();
  const kind = window.__pickCustodyKind;
  if(kind==='feed') Modals.addBudgetLine(custodyId);
  else if(kind==='expense') Modals.addExpense(custodyId);
  else if(kind==='transfer') Modals.addTransfer(custodyId);
};

    const e = DB.custody_closures.find(x=>x.closure_id===recordId);
    title = 'تفاصيل المصروف الفعلي';
    filePath = e.file || null;
    rows = [
      ['العهدة', c ? c.description_ar : '—'],
      ['نوع المصروف', expenseTypeLabel(e.expense_type_id)],
      ['مركز التكلفة', costCenterLabel(e.cost_center_id)],
      ['البيان', e.statement || '—'],
      ['موقع/جهة الصرف', e.entry_location || '—', 'link'],
      ['المبلغ', money(e.amount)],
      ['العملة', e.currency||'SAR'],
      ['الحالة', e.disbursement_status],
      ['أدخله', userLabel(e.created_by)],
      ['تاريخ الإدخال', fmtDateTime(e.created_at)],
      ['اعتمده', e.approved_by ? userLabel(e.approved_by) : '—'],
      ['تاريخ الاعتماد', e.approved_at ? fmtDateTime(e.approved_at) : '—'],
    ];
  } else if(kind==='custody'){
    title = 'تفاصيل طلب العهدة';
    rows = [
      ['الوصف', c.description_ar || '—'],
      ['صاحب العهدة', userLabel(c.received_by_user_id)],
      ['أنشأ الطلب', userLabel(c.created_by)],
      ['تاريخ الإنشاء', fmtDateTime(c.created_at)],
      ['اعتمد الطلب', c.request_approved_by ? userLabel(c.request_approved_by) : '—'],
      ['تاريخ اعتماد الطلب', c.request_approval_date ? fmtDateTime(c.request_approval_date) : '—'],
      ['أقفل العهدة', c.closure_approved_by ? userLabel(c.closure_approved_by) : '—'],
      ['تاريخ الإقفال', c.closure_approval_date ? fmtDateTime(c.closure_approval_date) : '—'],
      ['عدد مرات الطباعة', c.Print_Count || 0],
    ];
  }
  const locRow = rows.find(r=>r[2]==='link' && r[1] && /^https?:\/\//.test(r[1]));
  const bodyHTML = `<div class="kv-grid">${rows.map(r=>{
    if(r[2]==='link' && r[1] && /^https?:\/\//.test(r[1])){
      return `<div><div class="kv-lbl">${esc(r[0])}</div><div class="kv-val"><a href="${esc(r[1])}" target="_blank" style="color:var(--teal);text-decoration:underline;">📍 فتح الموقع على الخريطة</a></div></div>`;
    }
    return `<div><div class="kv-lbl">${esc(r[0])}</div><div class="kv-val">${esc(String(r[1]))}</div></div>`;
  }).join('')}</div>`;
  const attachBtn = filePath ? `<button class="btn btn-outline" onclick="viewAttachment('${esc(filePath)}')">📎 عرض المرفق</button>` : '';
  const locBtn = locRow ? `<button class="btn btn-outline" onclick="window.open('${esc(locRow[1])}','_blank')">📍 عرض الموقع</button>` : '';
  openModalHTML(modalShell('auditModal', title, bodyHTML, false,
    `${locBtn}${attachBtn}<button class="btn btn-outline" onclick="closeModal()">إغلاق</button>`));
};

/* ============================= modal shell helper ============================= */
function modalShell(id, title, bodyHTML, wide, footHTML){
  return `
  <div class="modal-overlay" onmousedown="if(event.target===this) closeModal()">
    <div class="modal ${wide?'modal-wide':''}" id="${id}">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body" id="${id}Body">${bodyHTML}</div>
      <div class="modal-foot">${footHTML}</div>
    </div>
  </div>`;
}

Actions.saveTransfer = async function(custodyId){

  const note = document.getElementById('trNote').value;
  const fileInput = document.getElementById('trFile');
  if(!amt || amt<=0){ toast('أدخل مبلغًا صحيحًا','danger'); return; }
  if(amt > f.pendingTransfer + 0.009){ toast('المبلغ يتجاوز المصاريف التقديرية المعتمدة','danger'); return; }

  let filePath = null;

    if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'جارٍ رفع المرفق…'; }
    const up = await apiUpload(fileInput.files[0], 'custody_transfers');
    if(up.error){ toast('تعذّر رفع المرفق: ' + up.error.message, 'danger'); if(saveBtn){ saveBtn.disabled=false; saveBtn.textContent='تنفيذ التحويل'; } return; }
    filePath = up.data.path;
    if(saveBtn){ saveBtn.textContent = 'جارٍ الحفظ…'; }

    transfer_id: uid('trf'), federation_id:c.federation_id, transfer_status:'مكتمل', user_id:c.received_by_user_id,

  });

  toast('تم تنفيذ التحويل بنجاح','success');
  App.render();
};

Views.federations = function(){
  const u = Session.user;
  const isAud = Perm.isAuditor(u);
  const isTop = Perm.isTopApprover(u);
  if(!isAud && !isTop) return `<div class="card card-pad">هذه الصفحة غير متاحة لصلاحيتك.</div>`;
  const feds = isAud ? DB.federations : DB.federations.filter(f=>f.federation_id===u.federation_id);

  function statsFor(f){
    const custodies = DB.custodies.filter(c=>c.federation_id===f.federation_id);
    const users = DB.users.filter(x=>x.federation_id===f.federation_id);
    const costCenters = DB.cost_centers.filter(x=>x.federation_id===f.federation_id);
    let spent=0, budget=0, transferred=0;
    custodies.forEach(c=>{ const fi=custodyFinancials(c); spent+=fi.approvedExpenses; budget+=fi.approvedBudget; transferred+=fi.totalTransferred; });
    return { custodies, users, costCenters, spent, budget, transferred };
  }

  if(isAud){
    const rows = feds.length ? feds.map(f=>{
      const s = statsFor(f);
      return `<tr>
        <td><b>${esc(f.federation_name_ar)}</b><div class="muted small">${esc(f.federation_name_en||'')}</div></td>
        <td class="num">${s.custodies.length}</td>
        <td class="num">${s.users.length}</td>
        <td class="num">${s.costCenters.length}</td>
        <td class="num">${money(s.budget)}</td>
        <td class="num">${money(s.transferred)}</td>
        <td class="num">${money(s.spent)}</td>
        <td>${fmtDate(f.created_at)}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="8"><div class="empty-row">لا توجد اتحادات</div></td></tr>`;
    return `
      <div class="section-head"><div><div class="eyebrow">صلاحية المراجع</div><h2>الاتحادات</h2></div></div>
      <div class="tbl-wrap mt-16">
        <table class="tbl"><thead><tr>
          <th>الاتحاد</th><th>عدد العهد</th><th>عدد المستخدمين</th><th>مراكز التكلفة</th><th>الميزانية المعتمدة</th><th>إجمالي المحوّل</th><th>المصروف الفعلي</th><th>تاريخ الإنشاء</th>
        </tr></thead><tbody>${rows}</tbody></table>
      </div>
    `;
  }

  const cards = feds.map(f=>{
    const s = statsFor(f);
    return `
    <div class="card card-pad">
      <h3 style="margin:0 0 4px;">${esc(f.federation_name_ar)}</h3>
      <div class="muted small mb-12">${esc(f.federation_name_en||'')}</div>
      <div class="kv-grid">
        <div><div class="kv-lbl">عدد العهد</div><div class="kv-val">${s.custodies.length}</div></div>
        <div><div class="kv-lbl">عدد المستخدمين</div><div class="kv-val">${s.users.length}</div></div>
        <div><div class="kv-lbl">عدد مراكز التكلفة</div><div class="kv-val">${s.costCenters.length}</div></div>
        <div><div class="kv-lbl">الميزانية المعتمدة</div><div class="kv-val num">${money(s.budget)}</div></div>
        <div><div class="kv-lbl">إجمالي المحوّل</div><div class="kv-val num">${money(s.transferred)}</div></div>
        <div><div class="kv-lbl">المصروف الفعلي</div><div class="kv-val num">${money(s.spent)}</div></div>
        <div><div class="kv-lbl">تاريخ الإنشاء</div><div class="kv-val">${fmtDate(f.created_at)}</div></div>
      </div>
      <div class="alert alert-info mt-16" style="margin-bottom:0;">هذه بيانات الاتحاد للعرض فقط ولا يمكن تعديلها من داخل النظام.</div>
    </div>`;
  }).join('');
  return `
    <div class="section-head"><div><div class="eyebrow">نظرة عامة</div><h2>بيانات الاتحاد</h2></div></div>
    <div class="custody-grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr));">${cards}</div>
  `;
};

Actions.changePassword = async function(){
  const u = Session.user;
  const oldP = document.getElementById('pwOld').value;
  const newP = document.getElementById('pwNew').value;
  const conf = document.getElementById('pwConfirm').value;
  const alertEl = document.getElementById('pwAlert');
  if(!oldP){ alertEl.innerHTML = `<div class="alert alert-danger mt-12">أدخل كلمة المرور الحالية</div>`; return; }
  if(!newP || newP.length<4){ alertEl.innerHTML = `<div class="alert alert-danger mt-12">كلمة المرور الجديدة قصيرة جدًا</div>`; return; }
  if(newP !== conf){ alertEl.innerHTML = `<div class="alert alert-danger mt-12">تأكيد كلمة المرور غير مطابق</div>`; return; }
  const { data, error } = await apiCall({ op:'rpc', fn:'change_password', args:{ p_user_id: u.user_id, p_old_password: oldP, p_new_password: newP } });
  if(error){ alertEl.innerHTML = `<div class="alert alert-danger mt-12">تعذّر الاتصال بقاعدة البيانات: ${esc(error.message)}</div>`; return; }
  if(!data){ alertEl.innerHTML = `<div class="alert alert-danger mt-12">كلمة المرور الحالية غير صحيحة</div>`; return; }
  alertEl.innerHTML = `<div class="alert alert-success mt-12">تم تحديث كلمة المرور بنجاح</div>`;
  toast('تم تحديث كلمة المرور','success');
};

function renderUserCustodyPanel(userId){
  const s = userCustodySummary(userId);
  const stats = `
  <div class="stats-grid">
    <div class="stat-card accent-teal"><div class="lbl">عدد العهد</div><div class="val num">${s.custodies.length}</div>
      <div class="sub">${s.openCount} مفتوحة · ${s.closedCount} مغلقة · ${s.pendingCount} قيد الاعتماد</div></div>
    <div class="stat-card"><div class="lbl">إجمالي الميزانية المعتمدة</div><div class="val num">${money(s.approvedBudget)}</div></div>
    <div class="stat-card accent-danger"><div class="lbl">إجمالي المصروف المعتمد</div><div class="val num">${money(s.approvedExpenses)}</div></div>
    <div class="stat-card accent-gold"><div class="lbl">الرصيد المتبقي (العهد المفتوحة)</div><div class="val num">${money(s.remainingBalance)}</div></div>
  </div>`;

  const custodyRows = s.custodies.length ? s.custodies.map(c=>{
    const f = custodyFinancials(c);
    return `<tr class="clickable-row" onclick="App.go('custodyDetail',{id:'${c.custody_id}'})">
      <td><b>${esc(c.description_ar||'بدون وصف')}</b></td>
      <td>${custodyStatusBadge(c.custody_status)}</td>
      <td class="num">${money(f.approvedBudget)}</td>
      <td class="num">${money(f.approvedExpenses)}</td>
      <td class="num">${money(f.remainingBalance)}</td>
      <td>${fmtDate(c.created_at)}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="6"><div class="empty-row">لا توجد عهد لهذا المستخدم</div></td></tr>`;

  const ccRows = s.costCentersUsed.length ? s.costCentersUsed.map(cc=>`
    <tr><td>${esc(cc.name)}</td><td class="num">${money(cc.amount)}</td></tr>
  `).join('') : `<tr><td colspan="2"><div class="empty-row">لا توجد مصاريف مسجّلة بعد</div></td></tr>`;

  return `
    <h3 class="block-title">العهد النقدية</h3>
    ${stats}
    <div class="tbl-wrap mt-16">
      <table class="tbl"><thead><tr><th>العهدة</th><th>الحالة</th><th>الميزانية المعتمدة</th><th>المصروف المعتمد</th><th>الرصيد المتبقي</th><th>تاريخ الطلب</th></tr></thead>
      <tbody>${custodyRows}</tbody></table>
    </div>
    <h3 class="block-title mt-24">مراكز التكلفة المستخدمة</h3>
    <div class="tbl-wrap">
      <table class="tbl"><thead><tr><th>مركز التكلفة</th><th>إجمالي المصروف</th></tr></thead>
      <tbody>${ccRows}</tbody></table>
    </div>
  `;
}
(function guardActionsAgainstDoubleSubmit(){
  let busy = false;
  Object.keys(Actions).forEach(function(name){
    const orig = Actions[name];
    Actions[name] = async function(...args){
      if(busy){ return; }
      busy = true;
      try{
        return await orig.apply(this, args);
      } finally {
        busy = false;
      }
    };
  });
})();

});
