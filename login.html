<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — بوابة الأنظمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<link rel="stylesheet" href="shared.css">
<style>
  .system-choice{display:grid;gap:12px;margin-top:4px;}
  .system-btn{
    display:flex;align-items:center;gap:14px;text-align:right;
    padding:16px 18px;border-radius:14px;border:1.5px solid var(--line);
    background:var(--panel);cursor:pointer;transition:.15s;width:100%;
  }
  .system-btn:hover{border-color:var(--teal);box-shadow:0 4px 14px rgba(0,0,0,.06);transform:translateY(-1px);}
  .system-btn .ic{
    width:44px;height:44px;border-radius:10px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    background:var(--line-soft);font-size:22px;
  }
  .system-btn .txt{flex:1;}
  .system-btn .ttl{font-weight:800;color:var(--ink);font-size:15.5px;}
  .system-btn .sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .back-link{display:inline-block;margin-bottom:10px;color:var(--muted);cursor:pointer;font-size:13px;}
  .back-link:hover{color:var(--ink);}
  .chosen-badge{
    display:inline-flex;align-items:center;gap:6px;background:var(--line-soft);
    color:var(--ink-2);font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px;margin-bottom:10px;
  }
</style>
</head>
<body>

<!-- ============ SCREEN 1: LOADING ============ -->
<div id="screen-boot" class="stage">
  <div class="stage-card">
    <div class="brandmark"><img src="logo.png" alt="الشعار" style="width:100%;height:100%;object-fit:contain;border-radius:10px;"></div>
    <h1 class="stage-title">بوابة الأنظمة</h1>
    <p class="stage-sub">جارٍ التحقق من حالة الخادم…</p>
  </div>
</div>

<!-- ============ SCREEN 2: CHOOSE SYSTEM ============ -->
<div id="screen-choose" class="stage hidden">
  <div class="stage-card">
    <div class="brandmark"><img src="logo.png" alt="الشعار" style="width:100%;height:100%;object-fit:contain;border-radius:10px;"></div>
    <h1 class="stage-title">اختر النظام</h1>
    <p class="stage-sub">حدّد النظام الذي تريد الدخول إليه.</p>
    <div class="system-choice">
      <button type="button" class="system-btn" onclick="chooseSystem('custody')">
        <div class="ic">💰</div>
        <div class="txt">
          <div class="ttl">نظام إدارة العهد النقدية</div>
          <div class="sub">العهد، التحويلات، المصاريف الفعلية والتقديرية</div>
        </div>
      </button>
      <button type="button" class="system-btn" onclick="chooseSystem('secondments')">
        <div class="ic">✈️</div>
        <div class="txt">
          <div class="ttl">نظام إدارة الانتدابات وتذاكر السفر</div>
          <div class="sub">طلبات الانتداب وحجوزات تذاكر السفر</div>
        </div>
      </button>
    </div>
    <div id="noUsersNotice"></div>
  </div>
</div>

<!-- ============ SCREEN 3: LOGIN FORM ============ -->
<div id="screen-login" class="stage hidden">
  <div class="stage-card">
    <div class="brandmark"><img src="logo.png" alt="الشعار" style="width:100%;height:100%;object-fit:contain;border-radius:10px;"></div>
    <span class="back-link" onclick="backToChoice()">‹ رجوع لاختيار النظام</span>
    <h1 class="stage-title">تسجيل الدخول</h1>
    <div id="chosenBadge"></div>
    <p class="stage-sub">أدخل بيانات حسابك للمتابعة.</p>
    <div class="card card-pad">
      <div class="field">
        <label>اسم المستخدم</label>
        <input type="text" id="loginUser" placeholder="اسم المستخدم" autocomplete="username">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-block" id="loginBtn" onclick="doLogin()">تسجيل الدخول</button>
      <div id="loginAlert"></div>
    </div>
  </div>
</div>

<!-- ============ SCREEN 4: التحقق بخطوتين ============ -->
<div id="screen-2fa" class="stage hidden">
  <div class="stage-card">
    <div class="brandmark"><img src="logo.png" alt="الشعار" style="width:100%;height:100%;object-fit:contain;border-radius:10px;"></div>
    <span class="back-link" onclick="backToLogin()">‹ رجوع</span>
    <h1 class="stage-title">التحقق بخطوتين</h1>
    <div id="otpSetupBox"></div>
    <p class="stage-sub" id="otpSub">أدخل رمز التحقق المكوّن من 6 أرقام من تطبيق المصادقة.</p>
    <div class="card card-pad">
      <div class="field">
        <label>رمز التحقق</label>
        <input type="text" id="otpCode" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="000000" style="letter-spacing:8px;font-size:20px;text-align:center;">
      </div>
      <button class="btn btn-primary btn-block" id="otpBtn" onclick="doVerify2fa()">تأكيد</button>
      <div id="otpAlert"></div>
    </div>
  </div>
</div>

<div id="toastRoot"></div>

<script>
/* أنواع مستخدمين ممنوعة من تسجيل الدخول إلى أي نظام (لاعب/حكم/متعاون) —
   نفس القائمة الموجودة في index.html وserver.js، للتحقق المبكر على العميل. */
const NO_LOGIN_USER_TYPES = ['لاعب','حكم','متعاون'];
const SYSTEM_LABELS = { custody:'نظام إدارة العهد النقدية', secondments:'نظام إدارة الانتدابات وتذاكر السفر' };
const SYSTEM_TARGETS = { custody:'index.html', secondments:'secondments.html' };
let chosenSystem = null;
let PendingLogin = null; // { preToken, otpSetup, setupSecret, setupAccount }

async function apiCall(body){
  let res;
  try{
    res = await fetch('/api/db', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  }catch(e){
    return { data:null, error:{ message:'تعذّر الاتصال بالخادم. تأكد من اتصالك بالإنترنت.' } };
  }
  try{ return await res.json(); }
  catch(e){ return { data:null, error:{ message:'استجابة غير متوقعة من الخادم (رمز الحالة: '+res.status+')' } }; }
}

function showScreen(id){
  ['screen-boot','screen-choose','screen-login','screen-2fa'].forEach(s=>{
    document.getElementById(s).classList.toggle('hidden', s!==id);
  });
}

function chooseSystem(sys){
  chosenSystem = sys;
  document.getElementById('chosenBadge').innerHTML = `<span class="chosen-badge">${SYSTEM_LABELS[sys]}</span>`;
  document.getElementById('loginAlert').innerHTML = '';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  showScreen('screen-login');
  document.getElementById('loginUser').focus();
}

function backToChoice(){
  chosenSystem = null;
  showScreen('screen-choose');
}

async function doLogin(){
  if(!chosenSystem){ backToChoice(); return; }
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const alertEl = document.getElementById('loginAlert');
  const btn = document.getElementById('loginBtn');
  alertEl.innerHTML = '';
  if(!username || !password){
    alertEl.innerHTML = `<div class="alert alert-danger">الرجاء إدخال اسم المستخدم وكلمة المرور.</div>`;
    return;
  }
  btn.disabled = true; btn.textContent = 'جارٍ التحقق…';
  const { data, token, otpRequired, otpSetup, preToken, setupSecret, setupAccount, error } = await apiCall({ op:'rpc', fn:'login', args:{ p_username: username, p_password: password } });
  btn.disabled = false; btn.textContent = 'تسجيل الدخول';
  if(error){
    alertEl.innerHTML = `<div class="alert alert-danger">${esc(error.message)}</div>`;
    return;
  }
  if(otpRequired){
    PendingLogin = { preToken, otpSetup, setupSecret, setupAccount };
    showOtpScreen();
    return;
  }
  const u = (data && data[0]) ? data[0] : null;
  if(!u){
    alertEl.innerHTML = `<div class="alert alert-danger">اسم المستخدم أو كلمة المرور غير صحيحة.</div>`;
    return;
  }
  if(NO_LOGIN_USER_TYPES.includes(u.user_type)){
    alertEl.innerHTML = `<div class="alert alert-danger">هذا الحساب لا يملك صلاحية الدخول إلى أي نظام.</div>`;
    return;
  }
  if(u.user_status !== 'مفتوح'){
    const msgs = {'مغلق':'هذا الحساب مغلق.','تحت المعالجة':'حسابك بانتظار موافقة رئيس الاتحاد أو المدير التنفيذي.','مسودة':'حسابك لا يزال في وضع المسودة ولم يُفعّل بعد.'};
    alertEl.innerHTML = `<div class="alert alert-warning">${esc(msgs[u.user_status] || 'الحساب غير مفعّل حاليًا.')}</div>`;
    return;
  }
  Auth.saveSession(u, token);
  window.location.href = SYSTEM_TARGETS[chosenSystem];
}

function showOtpScreen(){
  const box = document.getElementById('otpSetupBox');
  const sub = document.getElementById('otpSub');
  document.getElementById('otpAlert').innerHTML = '';
  document.getElementById('otpCode').value = '';
  if(PendingLogin.otpSetup){
    sub.textContent = 'هذه أول مرة تسجّل فيها الدخول — أعدّ تطبيق مصادقة على جوالك (مثل Google Authenticator أو Microsoft Authenticator)، ثم أدخل الرمز المكوّن من 6 أرقام الذي يظهر بالتطبيق.';
    box.innerHTML = `
      <div class="alert alert-info">
        <div style="font-weight:800;margin-bottom:6px;">إعداد التحقق بخطوتين لأول مرة</div>
        <div class="small">افتح تطبيق المصادقة، اختر "إضافة حساب" ثم "إدخال مفتاح الإعداد يدويًا" (Enter setup key manually)، وأدخل:</div>
        <div style="margin:10px 0 6px;">
          <div class="small muted">اسم الحساب</div>
          <div style="font-weight:800;">${esc(PendingLogin.setupAccount)}</div>
        </div>
        <div>
          <div class="small muted">مفتاح الإعداد (Setup key / Time-based)</div>
          <div style="font-family:monospace;font-size:16px;font-weight:800;letter-spacing:2px;background:var(--line-soft);padding:8px 10px;border-radius:8px;margin-top:4px;word-break:break-all;">${esc(PendingLogin.setupSecret)}</div>
        </div>
      </div>`;
  }else{
    sub.textContent = 'أدخل رمز التحقق المكوّن من 6 أرقام من تطبيق المصادقة المرتبط بحسابك.';
    box.innerHTML = '';
  }
  showScreen('screen-2fa');
  document.getElementById('otpCode').focus();
}

function backToLogin(){
  PendingLogin = null;
  showScreen('screen-login');
}

async function doVerify2fa(){
  if(!PendingLogin){ backToLogin(); return; }
  const code = document.getElementById('otpCode').value.trim();
  const alertEl = document.getElementById('otpAlert');
  const btn = document.getElementById('otpBtn');
  alertEl.innerHTML = '';
  if(!/^\d{6}$/.test(code)){
    alertEl.innerHTML = `<div class="alert alert-danger">أدخل رمزًا صحيحًا مكوّنًا من 6 أرقام.</div>`;
    return;
  }
  btn.disabled = true; btn.textContent = 'جارٍ التحقق…';
  const { data, token, error } = await apiCall({ op:'rpc', fn:'verify2fa', args:{ preToken: PendingLogin.preToken, code } });
  btn.disabled = false; btn.textContent = 'تأكيد';
  if(error){
    alertEl.innerHTML = `<div class="alert alert-danger">${esc(error.message)}</div>`;
    return;
  }
  const u = (data && data[0]) ? data[0] : null;
  if(!u || !token){
    alertEl.innerHTML = `<div class="alert alert-danger">تعذّر إكمال تسجيل الدخول.</div>`;
    return;
  }
  PendingLogin = null;
  Auth.saveSession(u, token);
  window.location.href = SYSTEM_TARGETS[chosenSystem];
}

function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function boot(){
  // إن كانت هناك جلسة محفوظة مسبقًا، لا حاجة لإعادة تسجيل الدخول
  const existing = Auth.readSession();
  if(existing && !NO_LOGIN_USER_TYPES.includes(existing.user_type)){
    showScreen('screen-choose');
    return;
  }
  // تحقّق سريع وخفيف من وجود مستخدمين في قاعدة البيانات (لإظهار تنبيه للمعدّ الأول فقط)
  try{
    const res = await fetch('/api/has-users');
    const { hasUsers } = await res.json();
    if(hasUsers === false){
      document.getElementById('noUsersNotice').innerHTML = `<div class="demo-box mt-16">
        <div style="font-weight:800;margin-bottom:6px;">⚠️ لا يوجد مستخدمون في قاعدة البيانات بعد.</div>
        <div class="small muted">أضف أول مستخدم (رئيس اتحاد) مباشرة من Supabase عبر SQL Editor أو Table Editor → جدول users. راجع تعليمات README لأمر SQL جاهز.</div>
      </div>`;
    }
  }catch(e){ /* تجاهل — سيظهر أي خطأ اتصال فعلي عند محاولة تسجيل الدخول */ }
  showScreen('screen-choose');
}

document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('loginPass').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  document.getElementById('loginUser').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  document.getElementById('otpCode').addEventListener('keydown', function(e){ if(e.key==='Enter') doVerify2fa(); });
  boot();
});
</script>
</body>
</html>
